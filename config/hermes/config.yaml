# AI Stack 2026 — Hermes Agent behaviour (NOM-413).
# SECRETS ARE NOT HERE.  The Telegram token, the LiteLLM key and the Mem0 key
# live in secrets/hermes.env, which compose mounts read-only at /opt/data/.env.
model:
  provider: custom
  base_url: http://litellm:4000/v1
  # Hermes sends the placeholder `no-key-required` to a custom endpoint unless
  # the key is named here; LiteLLM then answers 401 (found by NOM-416).
  key_env: OPENAI_API_KEY
  default: agent
  # Hermes refuses tool use below 64k (NOM-412 §5).  Ollama must be given the
  # same number (OLLAMA_CONTEXT_LENGTH) because the /v1 API ignores num_ctx.
  context_length: 65536

# THE ONLY MCP SERVER IS THE GATEWAY.  Its allowlist (config/litellm/config.yaml)
# is the one allowlist shared with n8n and Open WebUI; ci/invariants.py I17
# fails the build if this file names any other server or any stdio command.
mcp_servers:
  aistack:
    url: http://litellm:4000/mcp
    headers:
      Authorization: "Bearer ${OPENAI_API_KEY}"

memory:
  provider: mem0

# WHAT THE AGENT MAY CALL (NOM-416).  Telegram and the CLI get the gateway's
# tools (server `aistack`: the ONE allowlist) and memory, nothing else: no built-in
# terminal, browser, code execution or image tools.  This also keeps the tool
# list short enough for a small local model.
platform_toolsets:
  telegram: [aistack, memory]
  cli: [aistack, memory]

# Tool Search puts MCP tools behind a search step (tool_search / tool_describe /
# tool_call).  A 9B model spent four bridge calls finding a tool it could have
# called directly (NOM-416).  `off` sends every allowed tool to the model as is
# (checked in the request Hermes sent: both web tools present).  `defer: []`
# does NOT do this: MCP tools are always deferred while the bridge is on.
tools:
  tool_search:
    enabled: "off"

# MCP DISCOVERY MUST FINISH BEFORE THE FIRST TURN (NOM-416).  The gateway's MCP
# handshake took 8.6 s on the sandbox; Hermes' defaults snapshot the tool list
# after 1.5 s (gateway) and 15 s (one-shot), and a turn that misses it has NO
# tools: the model then writes a fake tool call as text and the answer is made
# up.  A reachable server still returns as soon as its handshake is done.
mcp_discovery_timeout: 60
mcp_single_query_discovery_timeout: 90
