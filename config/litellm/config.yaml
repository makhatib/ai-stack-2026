# AI Stack 2026 — LiteLLM.  THE ONE AUTHORISED INFERENCE FRONT DOOR (M2).
#
# Everything that calls a model calls this, with a per-app VIRTUAL KEY that
# carries its own budget and token accounting.  Nothing talks to Ollama
# directly: `inference` holds litellm and ollama and nobody else.
#
# NO CLOUD PROVIDER is configured.  Adding one attaches litellm to the `egress`
# bridge and MAKES TIER B MANDATORY — the installer preflight enforces that and
# refuses to write the provider otherwise.

model_list:
  # Local only.  Weights arrive through the model-puller helper, never through
  # Ollama's own egress — `inference` is internal and has no route off the host.
  - model_name: local-chat
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://ollama:11434
  - model_name: local-chat-8b
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://ollama:11434
  - model_name: local-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # MCP features OFF.  agentgateway was the stack's MCP policy point and its
  # gate failed; turning LiteLLM's own MCP on would reintroduce an unguarded
  # tool surface through the back door.
  enable_mcp: false
  # limits.yaml v1 — an independent SECOND ceiling, not the bound.  The bound
  # is `aistack_slot`: 4 + 20 finite rows in Postgres taken under
  # FOR UPDATE SKIP LOCKED.  A parallel-request cap in one process is not a
  # queue and cannot be one.
  max_parallel_requests: 8

litellm_settings:
  drop_params: true
  set_verbose: false
  # Request bodies and responses are user content.  Logging them here would
  # put chat transcripts in a place `support-bundle` collects.
  turn_off_message_logging: true
  json_logs: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 300
