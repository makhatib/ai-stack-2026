# AI Stack 2026 — LiteLLM.  THE ONE AUTHORISED INFERENCE FRONT DOOR (M2) AND,
# FROM v2, THE ONE MCP GATEWAY.
#
# Everything that calls a model calls this, with a per-app VIRTUAL KEY that
# carries its own budget and token accounting.  Nothing talks to Ollama
# directly: `inference` holds litellm and ollama and nobody else.
#
# NO CLOUD PROVIDER is configured.  Adding one attaches litellm to the `egress`
# bridge and MAKES TIER B MANDATORY — the installer preflight enforces that and
# refuses to write the provider otherwise.

model_list:
  # Local only.  Weights arrive through the model-puller helper, never through
  # Ollama's own egress — `inference` is internal and has no route off the host.
  #
  # TIER CHOICE IS A ONE-LINE EDIT: `agent` is what Hermes and Mem0 call.  It is
  # qwen3.5:9b (Tier 2, 16 GB CPU).  On Tier 1 (8 GB) NOM-412 measured that no
  # local model is usable for Hermes (2b invents answers, 4b does not fit next
  # to the stack); the open founder question R1 decides whether `agent` points
  # at a hosted model there.  Nothing else in the stack changes either way.
  - model_name: agent
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: http://ollama:11434
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
  - model_name: local-chat
    litellm_params:
      model: ollama_chat/qwen3.5:2b
      api_base: http://ollama:11434
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
  - model_name: local-chat-large
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: http://ollama:11434
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
  # bge-m3 (MIT, 1024 dims) is the Arabic-capable embedder NOM-412 picked.
  - model_name: embed
    litellm_params:
      model: ollama/bge-m3
      api_base: http://ollama:11434
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
  - model_name: local-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # MCP IS ON, AND THIS FILE IS THE ONE ALLOWLIST (NOM-412 §4, Tech Lead
  # decision on NOM-412).  Hermes, n8n and Open WebUI reach tools only through
  # this proxy's /mcp, each with its own virtual key; a key sees only the
  # servers in its `object_permission`.  NO stdio server may be declared here
  # and ci/invariants.py I17 fails the build if one is.
  enable_mcp: true
  max_parallel_requests: 8

# THE ALLOWLIST.  Two layers, both required:
#   allowed_tools   — the tool NAMES a client may call
#   allowed_params  — the argument KEYS per tool.  This is what makes the three
#                     G-AGENTS tests pass; `allowed_tools` alone FAILED test (b).
# A tool with no `allowed_params` entry gets NO argument check (NOM-412 limit 2),
# so ci/invariants.py I17 fails the build when one is missing.
# Limits that remain true: it is a KEY allowlist, not JSON-Schema validation, and
# `tools/list` shows the backend's live schema.  scripts/mcp-verify.py compares
# that live schema to config/mcp/tools.lock.json.
mcp_servers:
  web:
    url: http://mcp-web:8900/mcp
    transport: http
    description: "Web search (SearXNG) and one-page fetch (Crawl4AI)"
    allowed_tools: [web_search, fetch_page]
    allowed_params:
      web_search: [query, limit]
      fetch_page: [url]
  n8n:
    url: http://n8n:5678/mcp-server/http
    transport: http
    description: "n8n workflows that the owner marked available to MCP"
    auth_type: bearer_token
    authentication_token: os.environ/N8N_MCP_TOKEN
    allowed_tools: [search_workflows, get_workflow_details, execute_workflow]
    allowed_params:
      search_workflows: [query, limit]
      get_workflow_details: [workflowId]
      # n8n 2.44 REQUIRES executionMode, and needs triggerNodeName whenever
      # inputs are given (live tools/list, NOM-416).  With only workflowId and
      # inputs allowed, every call was refused.
      execute_workflow: [workflowId, executionMode, triggerNodeName, inputs]

litellm_settings:
  drop_params: true
  set_verbose: false
  # Request bodies and responses are user content.  Logging them here would
  # put chat transcripts in a place `support-bundle` collects.
  turn_off_message_logging: true
  # Traces go to Langfuse (profile `tracing`).  With the profile off the host
  # is unreachable and the callback logs a warning; requests are not affected.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  json_logs: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 300
