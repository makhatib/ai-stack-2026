# AI Stack 2026 — the Telegram gate (NOM-413).
#
# Hermes has to reach api.telegram.org and nothing else.  Hermes sits on an
# INTERNAL bridge with no route out; this container is the only other member
# of that bridge and the only one with a NAT'd path.  It is a TCP relay, not a
# proxy: it does NOT terminate TLS, so Hermes still verifies Telegram's own
# certificate, and the relay never sees a bot token in the clear.
#
# `ssl_preread` reads the SNI from the TLS ClientHello.  Any name other than
# api.telegram.org maps to the empty string, and `proxy_pass` to an empty
# upstream closes the connection.  What this does NOT stop: a client that
# sends SNI api.telegram.org and then speaks to Telegram's IP — which is
# exactly what Hermes is supposed to do.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

stream {
	# Docker's embedded DNS; the gate is NOT given an alias for the Telegram
	# name (Hermes reaches it through extra_hosts), so this resolves the real one.
	resolver 127.0.0.11 valid=30s ipv6=off;

	map $ssl_preread_server_name $tg_upstream {
		api.telegram.org  api.telegram.org:443;
		default           "";
	}

	server {
		listen 443;
		ssl_preread on;
		proxy_pass $tg_upstream;
		proxy_connect_timeout 10s;
		proxy_timeout 120s;
	}
}
