- Chat and documents:
    - Open WebUI:
        href: "{{HOMEPAGE_VAR_CHAT_URL}}"
        description: Chat, RAG and the document pipeline
        icon: mdi-chat

- Automation:
    - n8n:
        href: "{{HOMEPAGE_VAR_N8N_URL}}"
        description: Workflows. The only place a mutating action can run.
        icon: mdi-sitemap
