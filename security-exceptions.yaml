# AI Stack 2026 — the exceptions register.
#
# Every service merges the `x-hardened` anchor.  EVERY DEVIATION IS AN ENTRY
# HERE THAT A REVIEWER CAN GREP FOR — there are no quiet overrides.
#
# Every entry carries `approved_by` and `approved_at` (A NAMED HUMAN, who must
# be on security-approvers.yaml — see `approval:` at the end of this file and
# ci/approvers.py for the rule, which no agent of this company can satisfy)
# and a `review_by` date <= 180 days EVEN WHEN THE ENTRY IS PERMANENT.  CI
# fails the build when an entry is missing approval, is past `review_by`, has a
# review window LONGER than 180 days, or records a digest that no longer
# matches the pin — a change invalidates its own evidence rather than
# inheriting it.
#
# THE LAST TWO OF THOSE WERE PROSE UNTIL NOM-341.  This paragraph claimed both
# for days and no code implemented either.  What CI actually did was check
# whether `review_by` was already PAST — which a date in 2099 passes forever —
# and nothing at all about the digest.  That mattered here specifically: E7
# carried a Debian 12 pgvector digest and a capability set bisected against it,
# and NOM-341 moved that pin to Debian 13, so an unenforced binding would have
# left Debian 12 evidence sitting under a Debian 13 image reading as approved.
# Both are now asserted by ci/invariants.py I9, the window from the shared rule
# in ci/approvers.py so this register and security-findings.yaml are held to
# one cap.  tests/register-controls.sh drives each of them to failure on a
# scratch copy, because a check that has only ever passed is a note.

schema: aistack.security-exceptions.v1
version: 1

exceptions:
  - id: E1
    service: caddy
    exception: "cap_add: NET_BIND_SERVICE"
    why: "bind 443 and 80 as a non-root process"
    mitigation: "one capability and nothing else; C1 confirms no other cap is present"
    scope: all
    permanent: true
    approved_by: "Mahmoud Alkhatib"
    approved_at: 2026-10-20
    review_by: 2027-04-16

  - id: E6
    service: [open-webui, litellm]
    exception: "secret delivered as an ENVIRONMENT VARIABLE"
    why: "neither upstream supports a _FILE indirection [V-253]"
    mitigation: >-
      Own env_file, never .env and never the shell.  MEASURED CORRECTION
      (NOM-258): an `env_file` is read by the DOCKER CLI on the host as the
      invoking user and injected by the daemon — the container never opens it.
      So the design's "root-owned 0640 root:<service-gid>" is wrong in its
      second term: the file is written 0640 root:<OPERATOR-gid>, because the
      operator's compose invocation is what must read it.  This narrows what
      the exception covers rather than widening it: the file is a host
      artefact under host permissions, and the SECRET still reaches the
      application as an environment variable, which is the part the exception
      is actually about.
    residual: >-
      STATED IN FULL (F10): a compromise of either application can read that
      application's own environment, and host and daemon administrators remain
      inside the trust boundary.  We do not claim otherwise.  Bounded only
      because no container can reach the Docker API; weakening that re-opens
      this entry.
    scope: all
    permanent: true
    approved_by: "Mahmoud Alkhatib"
    approved_at: 2026-10-20
    review_by: 2027-04-16

  - id: E7
    service: postgres
    exception: "cap_add: CHOWN, SETUID, SETGID, DAC_READ_SEARCH"
    why: >-
      MEASURED by bisection against the pinned digest, NOT assumed.  The
      official entrypoint starts as root to prepare PGDATA and then drops to
      uid 999 via gosu.  CHOWN chowns PGDATA; SETUID and SETGID are the drop
      itself; DAC_READ_SEARCH lets root traverse an EXISTING PGDATA, which is
      0700 owned by 999.
      RE-BISECTED ON DEBIAN 13 [NOM-341] because the pin moved, and the set
      came out SMALLER: FOWNER WAS DROPPED.  It is not a sixth capability
      anyone removed as a tidy-up — it was in this entry as "the permission
      fix-up", and on the trixie digest, with FOWNER absent, first boot AND
      both restarts complete and the shipped healthcheck passes.  A capability
      that the bisection cannot show is required is not a measured capability,
      and this entry claims every one of its capabilities is measured.
    mitigation: >-
      DAC_READ_SEARCH IS DELIBERATE AND DAC_OVERRIDE IS NOT USED.  Both
      complete the restart path; DAC_OVERRIDE bypasses read, write AND execute
      checks on every file, DAC_READ_SEARCH bypasses only read and
      directory-search.  The entrypoint needs to traverse and read, not write.
      Postgres is on one internal bridge, publishes no port, and is never
      publishable.
    evidence: >-
      Bisected three times, each against the digest recorded below.  The FIRST
      bisection used a fresh volume each time and concluded four capabilities
      sufficed; that set starts a NEW database and then fails on the FIRST
      RESTART.  A capability set validated only against first boot is a
      container that works until it is restarted, which is why every pass
      since tests INIT and RESTART and a set passes only if both pass.
      THE DEBIAN 13 RE-BISECTION [NOM-341, 2026-10-20] ran that way.  Dropping
      each capability in turn from the declared five: CHOWN, SETUID and SETGID
      each break first boot ("failed switching to 'postgres': operation not
      permitted"); DAC_READ_SEARCH passes first boot and FAILS THE FIRST
      RESTART with `find: '/var/lib/postgresql/data/pgdata': Permission
      denied` — the recorded trap, reproduced on the new base; FOWNER breaks
      NOTHING.  The remaining four were then re-tested as a set, three
      independent trials of init + two restarts each, all pass; and each of
      those four was dropped again from WITHIN that set, and each one broke,
      so the set is minimal and not merely sufficient.  Re-run at FULL
      FIDELITY with the real /docker-entrypoint-initdb.d scripts, the real
      healthcheck and synthetic secrets: init and restart pass, the shipped
      healthcheck exits 0, and all four application roles are created.  Zero
      added capabilities fails first boot, which is the control showing the
      probe can fail.
    digest: sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84
    digest_note: >-
      THIS FIELD IS NOW ENFORCED.  This file's header has always said CI fails
      an entry recording a digest that no longer matches the pin; until
      NOM-341 no code did, and this entry is why it mattered — it carried the
      Debian 12 digest sha256:ac08538c... and a capability set bisected against
      it, and the pin moved to Debian 13.  ci/invariants.py I9 now binds this
      value to POSTGRES_DIGEST in versions.env and fails when they differ.
    scope: all
    permanent: true
    approved_by: "Mahmoud Alkhatib"
    approved_at: 2026-10-20
    review_by: 2027-04-16

  - id: E9
    service: authelia
    exception: "writable one-file bind at /app/.healthcheck.env"
    why: >-
      MEASURED: Authelia writes this file at startup so that a healthcheck
      subcommand can read its scheme, host and port.  Under `read_only: true`
      the write fails and the process exits during startup checks, reporting
      only "Errors occurred performing startup checks" and a Go stack.
      Notably the subcommand it is written for — `authelia health` — DOES NOT
      EXIST in 4.39.28, so the file is written and never read.
    mitigation: >-
      One file, not a directory.  A tmpfs cannot be mounted at a file path and
      a tmpfs over /app would hide the binary.  The file holds no secret.
      Authelia itself runs with NO added capabilities, because passing an
      explicit command takes its entrypoint's plain-exec branch instead of the
      chown + su-exec branch that would need SETUID and SETGID.
    digest: sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    scope: all
    permanent: true
    approved_by: "Mahmoud Alkhatib"
    approved_at: 2026-10-20
    review_by: 2027-04-16

  - id: E10
    service: homepage
    exception: "config files bound individually; /app/config is a tmpfs"
    why: >-
      MEASURED: Homepage writes logs into /app/config/logs.  A read-only bind
      over the whole directory makes the container fail to start, and the
      obvious repair — a tmpfs at /app/config/logs — cannot be created
      underneath a read-only mount.
    mitigation: >-
      Each config file is bound read-only by name, so the FILES are immutable
      while the directory they sit in is writable.  That is the property we
      actually wanted.  No secret is in any of them; Docker discovery is off
      and there is no docker.sock in any profile.
    scope: all
    permanent: true
    approved_by: "Mahmoud Alkhatib"
    approved_at: 2026-10-20
    review_by: 2027-04-16

  # --- deferred: the service that needed them is not shipped ----------------
  # A DEFERRED EXCEPTION IS NOT A CLOSED EXCEPTION.  CI treats these as out of
  # scope rather than as satisfied, and each must be re-approved against the
  # then-current digest before its group returns, with `review_by` restarting:
  # 180-day-old evidence for an unshipped image is not evidence.
  - id: E2
    service: "each GPU image separately — comfyui, ollama(GPU), whisper(GPU)"
    exception: "runs as root under the NVIDIA runtime"
    scope: deferred
    returns_with: "1.0 (voice, images)"
    note: >-
      PER IMAGE, NOT PER GROUP.  Each digest needs its own recorded non-root
      probe, smallest demonstrated privilege and named reviewer BEFORE that
      image is enabled.  Enabling one GPU image never licenses another.  GPU
      presence is not evidence root is required.
  - id: E3
    service: [crawl4ai, playwright-mcp]
    exception: "narrow seccomp permitting clone/setns/unshare"
    scope: deferred
    returns_with: "the `web` group"
  - id: E5
    service: wg-easy
    exception: "cap_add: NET_ADMIN"
    scope: deferred
    returns_with: "the `remote-access` group"

# ---------------------------------------------------------------------------
approval:
  state: SIGNED on 2026-10-20 by the named human [NOM-310]
  who_must_approve: "Mahmoud Alkhatib"
  authority_record: NOM-310
  authority_settled_on: 2026-10-20
  the_rule_is_shared: >-
    This register and security-findings.yaml are held to ONE rule, in
    ci/approvers.py.  They were not: both checks rejected `PENDING` and the
    string "DevOps Engineer", and NEITHER rejected "Tech Lead", an agent of
    this company and the one both registers named as reviewer [NOM-310].  The
    rule now also has a POSITIVE half — the value must be a name on
    security-approvers.yaml — because a denylist of two role names accepted
    every other string, "approved" and "ok" included.
  what_was_wrong_here_until_2026_10_20: >-
    E1, E6, E7, E9 and E10 carried `approved_by: "DevOps Engineer (NOM-258),
    pending Tech Lead review"` -- an agent recording ITSELF as the approver,
    which is not an approval, and I9 failed on each of them three times over.
    It was left in place deliberately as the evidence of the defect NOM-301
    found, and the signature pass replaced it on 2026-10-20.  E2, E3 and E5
    are `scope: deferred` and carry no approval field, so they were outside
    this entirely and still are.
  the_signature: >-
    WRITTEN on 2026-10-20, in one pass over both registers, on the corrected
    figures (V6/V10/V11 units and the Debian 13 Postgres base, NOM-341).  Its
    full provenance, including what it does NOT establish and the fact that
    an AGENT transcribed the name a human gave, is in security-findings.yaml
    `approval.signature` -- recorded once rather than in two drifting copies,
    which is this repository's own recorded lesson.
    ONE THING IN THIS REGISTER CHANGED WITH THAT PASS and a reader should see
    it named rather than finding it in a diff: E7 was re-bisected against the
    new Debian 13 digest and came out ONE CAPABILITY SMALLER — FOWNER is gone
    from E7 and from compose.yaml, measured, not tidied.  E1, E6, E9 and E10
    are untouched.  `approved_at` moved from 2026-10-18 to 2026-10-20 on all
    five: the old date was when the AGENT wrote its non-approval, and leaving
    it would have recorded the human approving two days before he was asked.

# DELIBERATELY NOT AN EXCEPTION: the Docker socket.
# A read-only socket proxy was evaluated and REJECTED.  Read access to the
# containers API returns every container's environment, which is exactly where
# E6 puts two secrets.  A read-only socket proxy here is a credential-
# disclosure endpoint wearing a least-privilege label.
