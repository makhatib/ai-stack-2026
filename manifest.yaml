# AI Stack 2026 — the frozen manifest.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH (final-design 2).
# Everything else is generated from it: the `profiles:` keys in compose, the
# COMPOSE_PROFILES defaults, the installer's group screens, the counts in the
# README, Homepage's services.yaml, the backup volume list, the publish
# allowlist, the healthcheck table and the CI invariants.
#
# A count that appears in prose anywhere and is not generated from this file is
# a bug.  Run `aistack manifest counts` to regenerate them.
#
# Scope values:  mvp | 1.0 | later
# This build (NOM-258) ships `scope: mvp` only.  `1.0` and `later` entries are
# carried so the predicates in ci/ are already at full width on the day a group
# returns (final-design I8, I11, §6 publish list).

schema: aistack.manifest.v1
version: 1

# ---------------------------------------------------------------------------
# Counts.  Declared separately because one number could not carry all three
# honestly (final-design §2.1).  CI (ci/i03_counts.py) asserts the rendered
# compose matches these, and that peak == steady_state + 1.
# ---------------------------------------------------------------------------
counts:
  # Services that serve traffic.  Regenerated by `aistack manifest counts`.
  steady_state:
    v2: 20             # v2 (NOM-413): MVP 9 + hermes, mem0, mcp-web, searxng, crawl4ai, telegram-gate + 5 tracing
    "1.0": 12          # was 13
  # Steady state + the helper lock's ceiling of 1.
  peak:
    v2: 21             # steady_state + the helper lock's ceiling of 1
    "1.0": 13          # was 14
  # A separate compose project, interlocked against serving.  Never in the peak.
  restore_drill: 4

# ---------------------------------------------------------------------------
# Profiles.  Three, not four (final-design §2.2).
# ---------------------------------------------------------------------------
profiles:
  starter:
    label: "Starter"
    groups: [core]
    containers: 14     # v2: core 8 + hermes, mem0, mcp-web, searxng, crawl4ai, telegram-gate
    modes: [local]
    workflows: [W4]
  automation:
    label: "AI Automation"
    groups: [core, knowledge]
    containers: 15     # starter + docling-serve
    modes: [local]          # public is 1.0 + Tier B + its own founder approval
    workflows: [W1, W2, W3, W4]
  traced:
    label: "AI Automation + tracing"
    groups: [core, knowledge, tracing]
    containers: 20     # automation + langfuse-web, langfuse-worker, clickhouse, minio, valkey
    modes: [local]
    workflows: [W1, W2, W3, W4]
  power:
    label: "AI Power User"
    groups: [core, knowledge, voice, images]
    containers: 12     # G-AGENTS failed; `agents` deferred
    modes: [local]
    workflows: [W1, W2, W3, W4, W5, W6]
    scope: "1.0"

# ---------------------------------------------------------------------------
# Modes (final-design §6).
# ---------------------------------------------------------------------------
modes:
  local:
    scope: mvp
    published: "443 + 80 bound to explicit addresses, never 0.0.0.0"
    tls: "Caddy internal CA, no ACME, no public DNS"
  public:
    scope: "1.0"
    tier: B
    requires_founder_approval: true
    surfaces: [open-webui, homepage]
  # `vpn` mode is the `remote-access` group; deferred with it (rev 10).

# ---------------------------------------------------------------------------
# Groups.
# ---------------------------------------------------------------------------
groups:
  core:
    scope: mvp
    profile_key: null        # no profile key — always runs
    services: [caddy, authelia, postgres, homepage, open-webui, ollama, litellm, n8n,
               hermes, mem0, mcp-web, searxng, crawl4ai, telegram-gate]
  knowledge:
    scope: mvp
    services: [docling-serve]
    gate: "no egress; two dedicated pairwise bridges, one per caller"
  agents:
    scope: later
    services: [agentgateway]
    gate: G-AGENTS
    gate_result: fail
    gate_result_file: gate/G-AGENTS-result.json
    gate_run_at: 2026-10-18
    gate_note: >-
      G-AGENTS FAILED on check (b) against
      agentgateway v1.6.0 @ sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c.
      (a) unknown-name rejection PASSED and (c) fail-closed startup PASSED, but
      the gateway dispatched a changed definition's extra argument to the
      backend.  Characterised: agentgateway 1.6.0 performs NO argument
      validation against the advertised inputSchema — with the backend serving
      a schema of {required:[document], additionalProperties:false}, an
      argument the schema forbids was dispatched and the required one was
      absent.  §0.1: "A gateway that silently forwards fails this gate."
      Per §0.1, §2.1 and F4 the group therefore leaves BOTH the MVP and 1.0 and
      moves here.  DEFERRAL IS NOT AN EVIDENCE DISCOUNT: it carries the same
      three proofs against the then-current digest on the day it returns.
  voice:
    scope: "1.0"
    services: [whisper-cpp, kokoro]
    gate: "STT wire test; English TTS only"
  images:
    scope: "1.0"
    services: [comfyui]
    gate: "GPU + NVIDIA Container Toolkit; per-digest E2 non-root probe"
  # `web` is NOT a group any more: searxng and crawl4ai are v2 core services
  # (DoD section 1, "Search").  playwright-mcp stays deferred.
  web-deferred:
    scope: later
    services: [playwright-mcp]
    deferred_by: "rev 10 — deferred with the <=30s contract (final-design §10.3)"
  gpu-serving:
    scope: later
    services: [vllm]
    deferred_by: "rev 10"
  code-sandbox:
    scope: later
    services: [open-terminal]
    deferred_by: "rev 10"
  remote-access:
    scope: later
    services: [wg-easy]
    deferred_by: "rev 10 — `vpn` mode is this group, so the mode is deferred too"
  tracing:
    scope: v2
    profile_key: tracing     # COMPOSE_PROFILES=...,tracing.  OFF by default: NOM-412 measured 2.6 GB idle, 3.1 GB p95
    services: [langfuse-web, langfuse-worker, clickhouse, minio, valkey]
    gate: "founder decision R2 (Tier 1 tracing); Valkey and the cloudpirates MinIO image were not tested with Langfuse by NOM-412"

# ---------------------------------------------------------------------------
# Bridges.  `zone_policy` is the per-bridge field that mandates `internal:`
# (final-design §5.2, rev 4 — keyed on zone_policy, NOT on class, because
# ui-comfy and ui-vpn are both class `ui` and need opposite flags).
#
#   contained  -> internal: true    no default route, no masquerade
#   published  -> internal: false   carries published host ports
#   nat_egress -> internal: false   members must reach the internet to function
#   forwarding -> internal: false   member forwards third-party traffic
#
# All four values stay in the schema even though 1.0 uses three: the deferred
# bridges return with their groups, and a schema that has to be re-extended is a
# schema somebody will re-extend differently.
# ---------------------------------------------------------------------------
bridges:
  edge:
    class: edge
    zone_policy: published
    internal: false
    members: [caddy, authelia]
    pairwise: false
    ipv6: host-default
    scope: mvp
  apps:
    class: app
    zone_policy: contained
    internal: true
    members: [caddy, authelia, homepage, open-webui, n8n]
    pairwise: false          # 5 members, deliberate
    ipv6: false
    scope: mvp
  gateway:
    class: gateway
    zone_policy: contained
    internal: true
    members: [open-webui, n8n, litellm, hermes, mem0, whisper-cpp, kokoro]
    pairwise: false
    ipv6: false
    scope: mvp
  inference:
    class: inference
    zone_policy: contained
    internal: true
    members: [litellm, ollama]
    pairwise: false
    ipv6: false
    scope: mvp
  data:
    class: data
    zone_policy: contained
    internal: true
    members: [postgres, authelia, open-webui, n8n, litellm, mem0, langfuse-web, langfuse-worker]
    pairwise: false
    ipv6: false
    scope: mvp
  # ---- v2 (NOM-413) ---------------------------------------------------------
  agent:
    class: agent
    zone_policy: contained
    internal: true
    members: [hermes, mem0]
    pairwise: true           # Hermes is mem0's only caller
    subnet: 172.31.252.0/29
    ipv6: false
    scope: v2
  mcp-web:
    class: mcp
    zone_policy: contained
    internal: true
    members: [litellm, mcp-web]
    pairwise: true           # LiteLLM is the ONLY caller of the web tools: that is what makes one allowlist real
    subnet: 172.31.249.0/29
    ipv6: false
    scope: v2
  tg-relay:
    class: relay
    zone_policy: contained
    internal: true
    members: [hermes, telegram-gate]
    pairwise: true
    subnet: 172.31.250.0/29
    ipv6: false
    scope: v2
  egress-tg:
    class: egress
    zone_policy: nat_egress
    internal: false
    members: [telegram-gate]
    pairwise: false
    subnet: 172.31.251.0/29
    ipv6: false
    scope: v2
  tracing:
    class: tracing
    zone_policy: contained
    internal: true
    members: [litellm, langfuse-web, langfuse-worker, clickhouse, minio, valkey]
    pairwise: false
    ipv6: false
    scope: v2
  agents:
    class: agents
    zone_policy: contained
    internal: true
    members: [open-webui, n8n, agentgateway, agentgateway-verify]
    pairwise: false
    ipv6: false
    scope: later
    deferred_by: >-
      G-AGENTS failed (gate/G-AGENTS-result.json). With agentgateway deferred
      this bridge's only remaining members are open-webui and n8n, which have
      nothing on it to call. A bridge whose purpose left with its group is
      deferred with the group, not kept empty.
  parse-owui:
    class: parse
    zone_policy: contained
    internal: true
    members: [open-webui, docling-serve]
    pairwise: true
    subnet: 172.31.244.0/29
    ipv6: false
    scope: mvp
  parse-agw:
    class: parse
    zone_policy: contained
    internal: true
    members: [agentgateway, docling-serve]
    pairwise: true
    subnet: 172.31.245.0/29
    ipv6: false
    scope: later
    deferred_by: >-
      G-AGENTS failed. One of this pairwise bridge's two members is
      agentgateway. The /29 stays reserved so the bridge returns with its
      group at the same address rather than being re-derived.
  egress:
    class: egress
    zone_policy: nat_egress
    internal: false
    members: [model-puller]        # + litellm IFF a cloud provider is configured
    pairwise: false
    subnet: 172.31.246.0/29
    ipv6: false
    scope: mvp
  ui-comfy:
    class: ui
    zone_policy: contained
    internal: true
    members: [caddy, comfyui]
    pairwise: true
    ipv6: false
    scope: "1.0"
  restore-drill:
    class: restore
    zone_policy: contained
    internal: true
    members: []                    # the drill project's own services
    pairwise: false
    subnet: 172.31.247.0/29
    ipv6: false
    scope: mvp
    separate_project: true
  untrusted-search:
    class: untrusted-fetch
    zone_policy: nat_egress
    internal: false
    members: [mcp-web, searxng]
    pairwise: true
    subnet: 172.31.240.0/29
    ipv6: false
    scope: v2
  untrusted-crawl:
    class: untrusted-fetch
    zone_policy: nat_egress
    internal: false
    members: [mcp-web, crawl4ai]
    pairwise: true
    subnet: 172.31.241.0/29
    ipv6: false
    scope: v2
  untrusted-browser:
    class: untrusted-fetch
    zone_policy: nat_egress
    internal: false
    members: [agentgateway, playwright-mcp]
    pairwise: true
    subnet: 172.31.242.0/29
    ipv6: false
    scope: later
  ui-exec:
    class: untrusted-exec
    zone_policy: contained
    internal: true
    members: [caddy, open-terminal]
    pairwise: true
    subnet: 172.31.243.0/29
    ipv6: false
    scope: later
  ui-vpn:
    class: ui
    zone_policy: forwarding
    internal: false
    members: [caddy, wg-easy]
    pairwise: true
    subnet: 172.31.248.0/29
    ipv6: false
    scope: later

# ---------------------------------------------------------------------------
# Dual-homing register (final-design §5.2).  I1b is an EQUALITY: CI computes the
# set of services whose bridges span more than one trust class and fails if it
# differs from this register in either direction.  An unlisted crosser and a
# stale entry both fail the PR.  v1 has exactly FIVE entries after G-AGENTS
# failed (the design's six included agentgateway).
# ---------------------------------------------------------------------------
trust_bridges:
  - service: caddy
    classes: [edge, app, ui]
    reason: "It IS the boundary. One reverse proxy is the whole point of one inbound path."
    controls: "no egress; admin endpoint disabled; forward-auth on every route; inbound identity headers stripped; read_only: true"
    reviewer: "security reviewer, NOM-267"
  - service: authelia
    classes: [edge, app, data]
    reason: "The IdP must be reachable from the proxy and reach its own database."
    controls: "own non-superuser role; no egress; file-backed user list, no self-registration; untrusted_input: no"
    reviewer: "security reviewer, NOM-267"
  - service: open-webui
    classes: [app, gateway, data, parse]        # `agents` dropped: G-AGENTS failed
    reason: "The application that owns the documents calls the parser, the model front door and its own database."
    controls: "parse-owui is a pairwise /29 whose other member has no egress, no published port and no bridge of any other class; no egress of its own; web search off (I7, I9); per-user ACL is the app's own"
    reviewer: "security reviewer, NOM-270"
  - service: n8n
    classes: [app, gateway, data]               # `agents` dropped: G-AGENTS failed
    reason: "The automation engine is a multi-zone client by definition."
    controls: "no egress in the MVP; non-superuser role; the approval envelope on every mutating action; webhook routes never publishable"
    reviewer: "security reviewer, NOM-267"
  - service: litellm
    classes: [gateway, inference, data]
    reason: "The one authorised inference front door, justified in writing under M2."
    controls: "per-app virtual keys and budgets; untrusted_input: transits; configuring a cloud provider makes Tier B mandatory, enforced by preflight"
    reviewer: "security reviewer, NOM-267"
  # ---- v2 (NOM-413) ----
  - service: hermes
    classes: [gateway, agent, relay]
    reason: "The personal agent calls the model/MCP front door, its memory store and (through the gate) Telegram."
    controls: "gVisor runtime (runsc) for all agent code execution; no egress of its own (Telegram only through telegram-gate, an SNI allowlist); tools only through LiteLLM's one MCP allowlist; Telegram ALLOWED_USERS set to the owner; no Docker socket"
    reviewer: "security reviewer, NOM-413"
  - service: mem0
    classes: [agent, gateway, data]
    reason: "The memory service reaches its own database and the model front door for extraction and embeddings."
    controls: "pairwise agent bridge (Hermes only); own non-superuser role; holds a LiteLLM key, never a provider key; API key from a file; no egress"
    reviewer: "security reviewer, NOM-413"
  - service: mcp-web
    classes: [mcp, untrusted-fetch]
    reason: "The only caller of SearXNG and Crawl4AI. It exposes two tools and is reachable only from LiteLLM."
    controls: "pairwise /29 with LiteLLM; fetch_page refuses non-public addresses; exactly two tools whose arguments are the LiteLLM allowed_params; no stdio; NOTE it has NAT egress through the two untrusted-fetch bridges (exception E3)"
    reviewer: "security reviewer, NOM-413"
  - service: telegram-gate
    classes: [relay, egress]
    reason: "Hermes' only path to Telegram. A TCP relay that forwards one hostname."
    controls: "nginx stream with ssl_preread: SNI other than api.telegram.org is refused; no TLS termination (Telegram's own certificate is verified by Hermes); no published port; read_only"
    reviewer: "security reviewer, NOM-413"
  - service: langfuse-web
    classes: [tracing, data]
    reason: "Tracing UI and ingest API; stores in Postgres, ClickHouse and S3."
    controls: "own non-superuser role; profile `tracing` (off by default); never published; no egress"
    reviewer: "security reviewer, NOM-413"
  - service: langfuse-worker
    classes: [tracing, data]
    reason: "Async ingestion worker; same stores as langfuse-web."
    controls: "own non-superuser role (shared langfuse database); profile `tracing`; no published port; no egress"
    reviewer: "security reviewer, NOM-413"
  # agentgateway's entry is REMOVED, not commented out as a sixth: I1b is an
  # EQUALITY, so a stale entry fails the PR exactly as hard as an unlisted
  # crosser. v1 therefore has FIVE entries, and that number is derived from
  # the gate result rather than carried from the design's prose.

# ---------------------------------------------------------------------------
# Services.
#
# Per-entry schema (final-design §2):
#   service, group, profiles[], image_var, networks[], publishable
#   (never|opt_in|always), depends_on[], volumes[], backup (yes|no + reason),
#   healthcheck (image|ours:<probe>|[A]), limits{mem,cpus,pids}, exception_ids[],
#   scope (mvp|1.0|later)
#
# `confined: true` is the I1 predicate's subject.  In 1.0 that is docling-serve
# and comfyui.
# ---------------------------------------------------------------------------
services:

  # --- core -----------------------------------------------------------------
  caddy:
    runtime_ids: "0:0"   # MEASURED 2026-10-18: Config.User empty, no entrypoint privilege drop
    group: core
    scope: mvp
    image_var: CADDY
    networks: [edge, apps, ui-comfy]
    untrusted_input: transits
    publishable: always
    ports: ["${AISTACK_BIND_ADDR}:443:443", "${AISTACK_BIND_ADDR}:80:80"]
    depends_on: [authelia]
    volumes: [caddy-data, caddy-config]
    backup: yes
    healthcheck: "ours:caddy-admin-disabled-probe"
    limits: { mem: 256m, cpus: "0.50", pids: 256 }
    exception_ids: [E1]
    confined: false

  authelia:
    runtime_ids: "0:0"   # MEASURED 2026-10-18: Config.User empty, no entrypoint privilege drop
    group: core
    scope: mvp
    image_var: AUTHELIA
    networks: [edge, apps, data]
    untrusted_input: no
    publishable: never
    depends_on: [postgres]
    volumes: [authelia-data]
    backup: yes
    healthcheck: image
    limits: { mem: 256m, cpus: "0.50", pids: 256 }
    exception_ids: []
    confined: false

  postgres:
    runtime_ids: "999:999"   # MEASURED 2026-10-18: getent passwd postgres in the pinned image
    group: core
    scope: mvp
    image_var: POSTGRES
    networks: [data]
    untrusted_input: no
    publishable: never
    depends_on: []
    volumes: [postgres-data]
    backup: yes
    # NOM-307: `ours:pg_isready` certified a cluster whose first-boot init had
    # died as healthy.  The probe now asserts one role and one database per
    # application plus the control table, and names what is missing.
    healthcheck: "ours:pg-init-complete"
    limits: { mem: 2g, cpus: "2.0", pids: 256 }
    exception_ids: []
    confined: false

  homepage:
    runtime_ids: "0:0"   # MEASURED 2026-10-18: Config.User root
    group: core
    scope: mvp
    image_var: HOMEPAGE
    networks: [apps]
    untrusted_input: no
    publishable: opt_in          # public mode, 1.0, Tier B
    depends_on: []
    volumes: []
    backup: "no — config is generated from the manifest"
    healthcheck: "ours:http-200"
    limits: { mem: 256m, cpus: "0.50", pids: 256 }
    exception_ids: []
    confined: false

  open-webui:
    runtime_ids: "0:0"   # MEASURED 2026-10-18: Config.User 0:0
    group: core
    scope: mvp
    image_var: OPEN_WEBUI
    networks: [apps, gateway, data, parse-owui]   # `agents` dropped: G-AGENTS failed
    untrusted_input: yes          # user uploads, model output
    publishable: opt_in           # public mode, 1.0, Tier B
    depends_on: [postgres, litellm]
    volumes: [openwebui-data]
    backup: yes
    healthcheck: image
    limits: { mem: 4g, cpus: "2.0", pids: 512 }
    exception_ids: [E6]
    confined: false

  ollama:
    runtime_ids: "0:0"   # MEASURED 2026-10-18: /proc/1/status of the running container
    group: core
    scope: mvp
    image_var: OLLAMA
    networks: [inference]
    untrusted_input: transits
    publishable: never
    depends_on: []
    volumes: [ollama-models]
    backup: "no — model weights are re-downloadable and >90% of the bytes"
    healthcheck: "ours:ollama-tags"
    limits: { mem: 8g, cpus: "4.0", pids: 256 }
    exception_ids: []
    confined: false

  litellm:
    runtime_ids: "0:0"   # MEASURED 2026-10-18: Config.User root
    group: core
    scope: mvp
    image_var: LITELLM
    networks: [gateway, inference, data, mcp-web, tracing]   # + egress IFF cloud provider -> Tier B
    untrusted_input: transits
    publishable: never
    depends_on: [postgres]
    volumes: []
    backup: "no — config is in config/, state is in postgres"
    healthcheck: "ours:http-health-liveliness"
    limits: { mem: 1g, cpus: "1.0", pids: 256 }
    exception_ids: [E6]
    confined: false

  n8n:
    runtime_ids: "1000:1000"   # MEASURED 2026-10-18: the `node` user in the pinned image
    group: core
    scope: mvp
    image_var: N8N
    networks: [apps, gateway, data]        # `agents` dropped: G-AGENTS failed; no egress in the MVP
    untrusted_input: yes
    publishable: opt_in          # app route only; editor/REST/webhook-test/form never
    depends_on: [postgres]
    volumes: [n8n-data]
    backup: yes
    healthcheck: "ours:http-healthz"
    limits: { mem: 2g, cpus: "1.0", pids: 256 }
    exception_ids: []
    confined: false

  # --- knowledge ------------------------------------------------------------
  docling-serve:
    runtime_ids: "1001:0"   # MEASURED 2026-10-18: /proc/1/status of the running container
    group: knowledge
    scope: mvp
    image_var: DOCLING
    networks: [parse-owui]                 # parse-agw deferred: G-AGENTS failed
    untrusted_input: yes          # hostile documents
    publishable: never
    depends_on: []
    volumes: [docling-models]
    backup: "no — model artefacts are re-fetchable"
    healthcheck: "ours:http-health"
    limits: { mem: 4g, cpus: "2.0", pids: 256 }
    exception_ids: []
    confined: true

  # --- v2 core (NOM-413) ----------------------------------------------------
  hermes:
    runtime_ids: "10000:10000"   # the `hermes` user the s6 stage drops to (NOM-412 §5); PID 1 itself starts as root
    group: core
    scope: v2
    image_var: HERMES
    networks: [gateway, agent, tg-relay]
    untrusted_input: yes          # Telegram messages, web pages, model output
    publishable: never
    depends_on: [litellm, mem0, telegram-gate]
    volumes: [hermes-data]
    backup: yes
    healthcheck: "ours:hermes-gateway-alive"
    limits: { mem: 2g, cpus: "2.0", pids: 512 }
    exception_ids: [E11]
    confined: false

  mem0:
    runtime_ids: "10001:10001"
    group: core
    scope: v2
    image_var: PYBASE             # built locally from build/mem0 on this digest-pinned base
    built: build/mem0
    networks: [agent, gateway, data]
    untrusted_input: yes          # stores text a user or a web page influenced
    publishable: never
    depends_on: [postgres, litellm]
    volumes: [mem0-data]
    backup: yes
    healthcheck: "ours:http-health"
    limits: { mem: 768m, cpus: "1.0", pids: 256 }
    exception_ids: []
    confined: false

  mcp-web:
    runtime_ids: "10001:10001"
    group: core
    scope: v2
    image_var: PYBASE
    built: build/mcp-web
    networks: [mcp-web, untrusted-search, untrusted-crawl]
    untrusted_input: yes          # page content and search results flow through it
    class: untrusted-fetch
    publishable: never
    depends_on: [searxng, crawl4ai]
    volumes: []
    backup: "no — stateless"
    healthcheck: "ours:mcp-initialize"
    limits: { mem: 256m, cpus: "0.50", pids: 256 }
    exception_ids: [E3]
    confined: false

  searxng:
    runtime_ids: "977:977"
    group: core
    scope: v2
    image_var: SEARXNG
    class: untrusted-fetch
    networks: [untrusted-search]
    untrusted_input: yes
    publishable: never
    depends_on: []
    volumes: []
    backup: "no — config is in config/searxng"
    healthcheck: "ours:http-healthz"
    limits: { mem: 512m, cpus: "1.0", pids: 256 }
    exception_ids: [E3]
    confined: true

  crawl4ai:
    group: core
    scope: v2
    image_var: CRAWL4AI
    class: untrusted-fetch
    networks: [untrusted-crawl]
    untrusted_input: yes          # hostile web pages rendered in Chromium
    publishable: never
    depends_on: []
    volumes: []
    backup: "no — stateless"
    healthcheck: "ours:http-health"
    limits: { mem: 2g, cpus: "2.0", pids: 1024 }
    exception_ids: [E3]
    confined: true

  telegram-gate:
    runtime_ids: "101:101"        # nginx user in the alpine image (set by the image; asserted by probe-images)
    group: core
    scope: v2
    image_var: NGINX
    networks: [tg-relay, egress-tg]
    untrusted_input: transits
    publishable: never
    depends_on: []
    volumes: []
    backup: "no — config is in config/telegram-gate"
    healthcheck: "ours:tcp-443"
    limits: { mem: 64m, cpus: "0.25", pids: 64 }
    exception_ids: []
    confined: false

  # --- tracing (profile `tracing`, off by default) --------------------------
  langfuse-web:
    runtime_ids: "1001:1001"
    group: tracing
    scope: v2
    image_var: LANGFUSE_WEB
    networks: [tracing, data]
    untrusted_input: transits     # traces carry prompts and tool output
    publishable: never
    depends_on: [postgres, clickhouse, minio, valkey]
    volumes: []
    backup: "no — traces are observability data; the langfuse DB is covered by pg_dump"
    healthcheck: "ours:http-health"
    limits: { mem: 1g, cpus: "1.0", pids: 256 }
    exception_ids: []
    confined: false

  langfuse-worker:
    runtime_ids: "1001:1001"
    group: tracing
    scope: v2
    image_var: LANGFUSE_WORKER
    networks: [tracing, data]
    untrusted_input: transits
    publishable: never
    depends_on: [postgres, clickhouse, minio, valkey]
    volumes: []
    backup: "no — stateless"
    healthcheck: "ours:http-health"
    limits: { mem: 1g, cpus: "1.0", pids: 256 }
    exception_ids: []
    confined: false

  clickhouse:
    runtime_ids: "101:101"
    group: tracing
    scope: v2
    image_var: CLICKHOUSE
    networks: [tracing]
    untrusted_input: no
    publishable: never
    depends_on: []
    volumes: [clickhouse-data]
    backup: "no — trace store; losing it loses traces, not configuration"
    healthcheck: "ours:clickhouse-ping"
    limits: { mem: 2g, cpus: "2.0", pids: 1024 }
    exception_ids: []
    confined: false

  minio:
    runtime_ids: "1001:1001"
    group: tracing
    scope: v2
    image_var: MINIO
    networks: [tracing]
    untrusted_input: no
    publishable: never
    depends_on: []
    volumes: [minio-data]
    backup: "no — event blobs for traces"
    healthcheck: "ours:minio-live"
    limits: { mem: 256m, cpus: "0.50", pids: 256 }
    exception_ids: []
    confined: false

  valkey:
    runtime_ids: "999:999"
    group: tracing
    scope: v2
    image_var: VALKEY
    networks: [tracing]
    untrusted_input: no
    publishable: never
    depends_on: []
    volumes: []
    backup: "no — queue/cache; persistence off"
    healthcheck: "ours:valkey-ping"
    limits: { mem: 192m, cpus: "0.50", pids: 128 }
    exception_ids: []
    confined: false

  # --- agents — DEFERRED, gate G-AGENTS FAILED 2026-10-18 --------------------
  # Kept in the manifest at scope `later` rather than deleted, so the publish
  # never-list, the I8 class list and the I11 zone_policy values stay at full
  # width and the group returns without anyone re-deriving them.
  agentgateway:
    group: agents
    scope: later
    gated_by: G-AGENTS
    gate_result: fail
    image_var: AGENTGATEWAY
    networks: [agents, parse-agw]
    untrusted_input: transits
    publishable: never
    depends_on: [docling-serve]
    volumes: []
    backup: "no — config is in config/, tools.lock.json is committed"
    healthcheck: "ours:http-ready"
    limits: { mem: 512m, cpus: "1.0", pids: 256 }
    exception_ids: []
    confined: false

  # --- 1.0 ------------------------------------------------------------------
  whisper-cpp:
    group: voice
    scope: "1.0"
    image_var: WHISPER
    networks: [gateway]
    untrusted_input: yes          # audio
    publishable: never
    volumes: [whisper-models]
    backup: "no — model artefacts are re-fetchable"
    healthcheck: "[A]"
    limits: { mem: 4g, cpus: "4.0", pids: 256 }
    exception_ids: [E2]           # GPU variant only
    confined: false

  kokoro:
    group: voice
    scope: "1.0"
    image_var: KOKORO
    networks: [gateway]
    untrusted_input: transits
    publishable: never
    volumes: [kokoro-models]
    backup: "no — model artefacts are re-fetchable"
    healthcheck: "[A]"
    limits: { mem: 2g, cpus: "2.0", pids: 256 }
    exception_ids: []
    confined: false

  comfyui:
    group: images
    scope: "1.0"
    image_var: COMFYUI
    networks: [ui-comfy]
    untrusted_input: yes
    publishable: never
    volumes: [comfyui-data]
    backup: "no — checkpoints are 6-15GB each and re-downloadable"
    healthcheck: "[A]"
    limits: { mem: 8g, cpus: "4.0", pids: 512 }
    exception_ids: [E2]
    confined: true

  # --- later ----------------------------------------------------------------
  playwright-mcp: { group: web-deferred, scope: later, networks: [untrusted-browser], untrusted_input: yes, publishable: never, confined: true, exception_ids: [E3] }
  vllm:         { group: gpu-serving,   scope: later, networks: [inference],         untrusted_input: transits, publishable: never, confined: false }
  open-terminal: { group: code-sandbox, scope: later, networks: [ui-exec],           untrusted_input: yes, publishable: never, confined: true }
  wg-easy:      { group: remote-access, scope: later, networks: [ui-vpn],            untrusted_input: no,  publishable: opt_in, confined: false, exception_ids: [E5] }

# ---------------------------------------------------------------------------
# Helpers.  Short-lived.  Each acquires one exclusive flock on
# /run/aistack/helper.lock before starting, so at most one helper exists at any
# instant (final-design §2.1).  CI (I3) asserts no helper declares
# `restart: unless-stopped`, so the steady-state count cannot be gamed.
# ---------------------------------------------------------------------------
helpers:
  model-puller:
    scope: mvp
    image_var: OLLAMA              # same image, different command
    networks: [egress]
    untrusted_input: no            # operator-supplied model name only
    restart: "no"
    writes_volumes: [ollama-models]
  backup-helper:
    scope: mvp
    runtime_ids: "999:999"         # MEASURED: it IS the postgres image
    image_var: POSTGRES            # pg_dump from the same major version
    networks: [data]
    untrusted_input: no
    restart: "no"
  agentgateway-verify:
    scope: later
    gated_by: G-AGENTS
    gate_result: fail
    image_var: AISTACK_VERIFY
    networks: [agents]
    untrusted_input: no
    restart: "no"
    note: "runs once at `up`, must exit 0 (flow 17)"

# ---------------------------------------------------------------------------
# Volumes, and whether the nightly `local rollback backup` takes them
# (final-design §7.4).  Excluded by design and said out loud: all model volumes
# — re-downloadable, and over 90% of the bytes.
# ---------------------------------------------------------------------------
volumes:
  postgres-data:   { backup: yes, how: "pg_dump --format=custom per database + pg_dumpall --globals-only" }
  n8n-data:        { backup: yes, how: tar }
  openwebui-data:  { backup: yes, how: tar }
  caddy-data:      { backup: yes, how: tar }
  caddy-config:    { backup: no,  why: "generated from config/ on every up" }
  authelia-data:   { backup: yes, how: tar }
  ollama-models:   { backup: no,  why: "re-downloadable; >90% of the bytes" }
  docling-models:  { backup: no,  why: "re-downloadable" }
  hermes-data:     { backup: yes, how: tar }
  mem0-data:       { backup: yes, how: tar }
  clickhouse-data: { backup: no,  why: "trace store; losing it loses traces, not configuration" }
  minio-data:      { backup: no,  why: "event blobs for traces" }
  whisper-models:  { backup: no,  why: "re-downloadable" }
  kokoro-models:   { backup: no,  why: "re-downloadable" }
  comfyui-data:    { backup: no,  why: "checkpoints are 6-15GB each and re-downloadable" }

# ---------------------------------------------------------------------------
# Publish allowlist (final-design §6).  Deferred and later services stay on the
# never-list rather than leaving it: a service that is not shipped cannot be
# published, so keeping it listed costs nothing and removing it would mean the
# list has to be re-widened on the day the group returns.
# ---------------------------------------------------------------------------
publish:
  ever:
    - open-webui
    - homepage
  never:
    - postgres
    - ollama
    - litellm
    - litellm-admin-ui
    - whisper-cpp
    - kokoro
    - docling-serve
    - agentgateway
    - comfyui
    - n8n-editor
    - n8n-rest-api
    - n8n-webhook-test
    - n8n-form
    - caddy-admin-endpoint
    - vllm
    - searxng
    - crawl4ai
    - playwright-mcp
    - open-terminal
    - wg-easy-admin-ui
    - langfuse
    - langfuse-web
    - hermes
    - mem0
    - mcp-web
    - telegram-gate
    - clickhouse
    - minio
    - valkey

# ---------------------------------------------------------------------------
# Demo workflows (final-design §2.2, §10.1).
# ---------------------------------------------------------------------------
workflows:
  W1:     { scope: mvp,   title: "Research over a local preloaded corpus", needs_internet: false }
  # W6 (multi-agent) was 1.0 and needed the `agents` group; it is deferred with it.
  W2:     { scope: mvp,   title: "Chat with your PDF (Docling -> pgvector)", needs_internet: false }
  W3:     { scope: mvp,   title: "Scheduled summary with the approval envelope", needs_internet: false }
  W4:     { scope: mvp,   title: "Webhook -> model -> stored result", needs_internet: false }
  W5:     { scope: "1.0", title: "English voice in, English voice out" }
  W6:     { scope: later, title: "Multi-agent over the parse tool", needs_group: agents }
  W1-web: { scope: later, title: "Internet-backed research", needs_group: web }
