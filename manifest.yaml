# AI Stack 2026 — the frozen manifest.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH (final-design 2).
# Everything else is generated from it: the `profiles:` keys in compose, the
# COMPOSE_PROFILES defaults, the installer's group screens, the counts in the
# README, Homepage's services.yaml, the backup volume list, the publish
# allowlist, the healthcheck table and the CI invariants.
#
# A count that appears in prose anywhere and is not generated from this file is
# a bug.  Run `aistack manifest counts` to regenerate them.
#
# Scope values:  mvp | 1.0 | later
# This build (NOM-258) ships `scope: mvp` only.  `1.0` and `later` entries are
# carried so the predicates in ci/ are already at full width on the day a group
# returns (final-design I8, I11, §6 publish list).

schema: aistack.manifest.v1
version: 1

# ---------------------------------------------------------------------------
# Counts.  Declared separately because one number could not carry all three
# honestly (final-design §2.1).  CI (ci/i03_counts.py) asserts the rendered
# compose matches these, and that peak == steady_state + 1.
# ---------------------------------------------------------------------------
counts:
  # Services that serve traffic.  Regenerated by `aistack manifest counts`.
  steady_state:
    mvp: 9             # G-AGENTS FAILED 2026-10-18 -> `agents` deferred (was 10)
    "1.0": 12          # was 13
  # Steady state + the helper lock's ceiling of 1.
  peak:
    mvp: 10            # steady_state + the helper lock's ceiling of 1 (was 11)
    "1.0": 13          # was 14
  # A separate compose project, interlocked against serving.  Never in the peak.
  restore_drill: 4

# ---------------------------------------------------------------------------
# Profiles.  Three, not four (final-design §2.2).
# ---------------------------------------------------------------------------
profiles:
  starter:
    label: "Starter"
    groups: [core]
    containers: 8
    modes: [local]
    workflows: [W4]
  automation:
    label: "AI Automation"
    groups: [core, knowledge]
    containers: 9      # G-AGENTS failed; `agents` deferred
    modes: [local]          # public is 1.0 + Tier B + its own founder approval
    workflows: [W1, W2, W3, W4]
  power:
    label: "AI Power User"
    groups: [core, knowledge, voice, images]
    containers: 12     # G-AGENTS failed; `agents` deferred
    modes: [local]
    workflows: [W1, W2, W3, W4, W5, W6]
    scope: "1.0"

# ---------------------------------------------------------------------------
# Modes (final-design §6).
# ---------------------------------------------------------------------------
modes:
  local:
    scope: mvp
    published: "443 + 80 bound to explicit addresses, never 0.0.0.0"
    tls: "Caddy internal CA, no ACME, no public DNS"
  public:
    scope: "1.0"
    tier: B
    requires_founder_approval: true
    surfaces: [open-webui, homepage]
  # `vpn` mode is the `remote-access` group; deferred with it (rev 10).

# ---------------------------------------------------------------------------
# Groups.
# ---------------------------------------------------------------------------
groups:
  core:
    scope: mvp
    profile_key: null        # no profile key — always runs
    services: [caddy, authelia, postgres, homepage, open-webui, ollama, litellm, n8n]
  knowledge:
    scope: mvp
    services: [docling-serve]
    gate: "no egress; two dedicated pairwise bridges, one per caller"
  agents:
    scope: later
    services: [agentgateway]
    gate: G-AGENTS
    gate_result: fail
    gate_result_file: gate/G-AGENTS-result.json
    gate_run_at: 2026-10-18
    gate_note: >-
      G-AGENTS FAILED on check (b) against
      agentgateway v1.6.0 @ sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c.
      (a) unknown-name rejection PASSED and (c) fail-closed startup PASSED, but
      the gateway dispatched a changed definition's extra argument to the
      backend.  Characterised: agentgateway 1.6.0 performs NO argument
      validation against the advertised inputSchema — with the backend serving
      a schema of {required:[document], additionalProperties:false}, an
      argument the schema forbids was dispatched and the required one was
      absent.  §0.1: "A gateway that silently forwards fails this gate."
      Per §0.1, §2.1 and F4 the group therefore leaves BOTH the MVP and 1.0 and
      moves here.  DEFERRAL IS NOT AN EVIDENCE DISCOUNT: it carries the same
      three proofs against the then-current digest on the day it returns.
  voice:
    scope: "1.0"
    services: [whisper-cpp, kokoro]
    gate: "STT wire test; English TTS only"
  images:
    scope: "1.0"
    services: [comfyui]
    gate: "GPU + NVIDIA Container Toolkit; per-digest E2 non-root probe"
  web:
    scope: later
    services: [searxng, crawl4ai, playwright-mcp]
    deferred_by: "rev 10 — deferred with the <=30s contract (final-design §10.3)"
  gpu-serving:
    scope: later
    services: [vllm]
    deferred_by: "rev 10"
  code-sandbox:
    scope: later
    services: [open-terminal]
    deferred_by: "rev 10"
  remote-access:
    scope: later
    services: [wg-easy]
    deferred_by: "rev 10 — `vpn` mode is this group, so the mode is deferred too"
  observability:
    scope: later
    services: [langfuse-web, langfuse-worker, clickhouse, valkey, garage]
    deferred_by: "later before rev 10 — Garage wire test, then backup + capacity"

# ---------------------------------------------------------------------------
# Bridges.  `zone_policy` is the per-bridge field that mandates `internal:`
# (final-design §5.2, rev 4 — keyed on zone_policy, NOT on class, because
# ui-comfy and ui-vpn are both class `ui` and need opposite flags).
#
#   contained  -> internal: true    no default route, no masquerade
#   published  -> internal: false   carries published host ports
#   nat_egress -> internal: false   members must reach the internet to function
#   forwarding -> internal: false   member forwards third-party traffic
#
# All four values stay in the schema even though 1.0 uses three: the deferred
# bridges return with their groups, and a schema that has to be re-extended is a
# schema somebody will re-extend differently.
# ---------------------------------------------------------------------------
bridges:
  edge:
    class: edge
    zone_policy: published
    internal: false
    members: [caddy, authelia]
    pairwise: false
    ipv6: host-default
    scope: mvp
  apps:
    class: app
    zone_policy: contained
    internal: true
    members: [caddy, authelia, homepage, open-webui, n8n]
    pairwise: false          # 5 members, deliberate
    ipv6: false
    scope: mvp
  gateway:
    class: gateway
    zone_policy: contained
    internal: true
    members: [open-webui, n8n, litellm, whisper-cpp, kokoro]
    pairwise: false
    ipv6: false
    scope: mvp
  inference:
    class: inference
    zone_policy: contained
    internal: true
    members: [litellm, ollama]
    pairwise: false
    ipv6: false
    scope: mvp
  data:
    class: data
    zone_policy: contained
    internal: true
    members: [postgres, authelia, open-webui, n8n, litellm]
    pairwise: false
    ipv6: false
    scope: mvp
  agents:
    class: agents
    zone_policy: contained
    internal: true
    members: [open-webui, n8n, agentgateway, agentgateway-verify]
    pairwise: false
    ipv6: false
    scope: later
    deferred_by: >-
      G-AGENTS failed (gate/G-AGENTS-result.json). With agentgateway deferred
      this bridge's only remaining members are open-webui and n8n, which have
      nothing on it to call. A bridge whose purpose left with its group is
      deferred with the group, not kept empty.
  parse-owui:
    class: parse
    zone_policy: contained
    internal: true
    members: [open-webui, docling-serve]
    pairwise: true
    subnet: 172.31.244.0/29
    ipv6: false
    scope: mvp
  parse-agw:
    class: parse
    zone_policy: contained
    internal: true
    members: [agentgateway, docling-serve]
    pairwise: true
    subnet: 172.31.245.0/29
    ipv6: false
    scope: later
    deferred_by: >-
      G-AGENTS failed. One of this pairwise bridge's two members is
      agentgateway. The /29 stays reserved so the bridge returns with its
      group at the same address rather than being re-derived.
  egress:
    class: egress
    zone_policy: nat_egress
    internal: false
    members: [model-puller]        # + litellm IFF a cloud provider is configured
    pairwise: false
    subnet: 172.31.246.0/29
    ipv6: false
    scope: mvp
  ui-comfy:
    class: ui
    zone_policy: contained
    internal: true
    members: [caddy, comfyui]
    pairwise: true
    ipv6: false
    scope: "1.0"
  restore-drill:
    class: restore
    zone_policy: contained
    internal: true
    members: []                    # the drill project's own services
    pairwise: false
    subnet: 172.31.247.0/29
    ipv6: false
    scope: mvp
    separate_project: true
  untrusted-search:
    class: untrusted-fetch
    zone_policy: nat_egress
    internal: false
    members: [agentgateway, searxng]
    pairwise: true
    subnet: 172.31.240.0/29
    ipv6: false
    scope: later
  untrusted-crawl:
    class: untrusted-fetch
    zone_policy: nat_egress
    internal: false
    members: [agentgateway, crawl4ai]
    pairwise: true
    subnet: 172.31.241.0/29
    ipv6: false
    scope: later
  untrusted-browser:
    class: untrusted-fetch
    zone_policy: nat_egress
    internal: false
    members: [agentgateway, playwright-mcp]
    pairwise: true
    subnet: 172.31.242.0/29
    ipv6: false
    scope: later
  ui-exec:
    class: untrusted-exec
    zone_policy: contained
    internal: true
    members: [caddy, open-terminal]
    pairwise: true
    subnet: 172.31.243.0/29
    ipv6: false
    scope: later
  ui-vpn:
    class: ui
    zone_policy: forwarding
    internal: false
    members: [caddy, wg-easy]
    pairwise: true
    subnet: 172.31.248.0/29
    ipv6: false
    scope: later

# ---------------------------------------------------------------------------
# Dual-homing register (final-design §5.2).  I1b is an EQUALITY: CI computes the
# set of services whose bridges span more than one trust class and fails if it
# differs from this register in either direction.  An unlisted crosser and a
# stale entry both fail the PR.  v1 has exactly FIVE entries after G-AGENTS
# failed (the design's six included agentgateway).
# ---------------------------------------------------------------------------
trust_bridges:
  - service: caddy
    classes: [edge, app, ui]
    reason: "It IS the boundary. One reverse proxy is the whole point of one inbound path."
    controls: "no egress; admin endpoint disabled; forward-auth on every route; inbound identity headers stripped; read_only: true"
    reviewer: "security reviewer, NOM-267"
  - service: authelia
    classes: [edge, app, data]
    reason: "The IdP must be reachable from the proxy and reach its own database."
    controls: "own non-superuser role; no egress; file-backed user list, no self-registration; untrusted_input: no"
    reviewer: "security reviewer, NOM-267"
  - service: open-webui
    classes: [app, gateway, data, parse]        # `agents` dropped: G-AGENTS failed
    reason: "The application that owns the documents calls the parser, the model front door and its own database."
    controls: "parse-owui is a pairwise /29 whose other member has no egress, no published port and no bridge of any other class; no egress of its own; web search off (I7, I9); per-user ACL is the app's own"
    reviewer: "security reviewer, NOM-270"
  - service: n8n
    classes: [app, gateway, data]               # `agents` dropped: G-AGENTS failed
    reason: "The automation engine is a multi-zone client by definition."
    controls: "no egress in the MVP; non-superuser role; the approval envelope on every mutating action; webhook routes never publishable"
    reviewer: "security reviewer, NOM-267"
  - service: litellm
    classes: [gateway, inference, data]
    reason: "The one authorised inference front door, justified in writing under M2."
    controls: "per-app virtual keys and budgets; untrusted_input: transits; configuring a cloud provider makes Tier B mandatory, enforced by preflight"
    reviewer: "security reviewer, NOM-267"
  # agentgateway's entry is REMOVED, not commented out as a sixth: I1b is an
  # EQUALITY, so a stale entry fails the PR exactly as hard as an unlisted
  # crosser. v1 therefore has FIVE entries, and that number is derived from
  # the gate result rather than carried from the design's prose.

# ---------------------------------------------------------------------------
# Services.
#
# Per-entry schema (final-design §2):
#   service, group, profiles[], image_var, networks[], publishable
#   (never|opt_in|always), depends_on[], volumes[], backup (yes|no + reason),
#   healthcheck (image|ours:<probe>|[A]), limits{mem,cpus,pids}, exception_ids[],
#   scope (mvp|1.0|later)
#
# `confined: true` is the I1 predicate's subject.  In 1.0 that is docling-serve
# and comfyui.
# ---------------------------------------------------------------------------
services:

  # --- core -----------------------------------------------------------------
  caddy:
    runtime_ids: "0:0"   # MEASURED 2026-10-18: Config.User empty, no entrypoint privilege drop
    group: core
    scope: mvp
    image_var: CADDY
    networks: [edge, apps, ui-comfy]
    untrusted_input: transits
    publishable: always
    ports: ["${AISTACK_BIND_ADDR}:443:443", "${AISTACK_BIND_ADDR}:80:80"]
    depends_on: [authelia]
    volumes: [caddy-data, caddy-config]
    backup: yes
    healthcheck: "ours:caddy-admin-disabled-probe"
    limits: { mem: 256m, cpus: "0.50", pids: 256 }
    exception_ids: [E1]
    confined: false

  authelia:
    runtime_ids: "0:0"   # MEASURED 2026-10-18: Config.User empty, no entrypoint privilege drop
    group: core
    scope: mvp
    image_var: AUTHELIA
    networks: [edge, apps, data]
    untrusted_input: no
    publishable: never
    depends_on: [postgres]
    volumes: [authelia-data]
    backup: yes
    healthcheck: image
    limits: { mem: 256m, cpus: "0.50", pids: 256 }
    exception_ids: []
    confined: false

  postgres:
    runtime_ids: "999:999"   # MEASURED 2026-10-18: getent passwd postgres in the pinned image
    group: core
    scope: mvp
    image_var: POSTGRES
    networks: [data]
    untrusted_input: no
    publishable: never
    depends_on: []
    volumes: [postgres-data]
    backup: yes
    healthcheck: "ours:pg_isready"
    limits: { mem: 2g, cpus: "2.0", pids: 256 }
    exception_ids: []
    confined: false

  homepage:
    runtime_ids: "0:0"   # MEASURED 2026-10-18: Config.User root
    group: core
    scope: mvp
    image_var: HOMEPAGE
    networks: [apps]
    untrusted_input: no
    publishable: opt_in          # public mode, 1.0, Tier B
    depends_on: []
    volumes: []
    backup: "no — config is generated from the manifest"
    healthcheck: "ours:http-200"
    limits: { mem: 256m, cpus: "0.50", pids: 256 }
    exception_ids: []
    confined: false

  open-webui:
    runtime_ids: "0:0"   # MEASURED 2026-10-18: Config.User 0:0
    group: core
    scope: mvp
    image_var: OPEN_WEBUI
    networks: [apps, gateway, data, parse-owui]   # `agents` dropped: G-AGENTS failed
    untrusted_input: yes          # user uploads, model output
    publishable: opt_in           # public mode, 1.0, Tier B
    depends_on: [postgres, litellm]
    volumes: [openwebui-data]
    backup: yes
    healthcheck: image
    limits: { mem: 4g, cpus: "2.0", pids: 512 }
    exception_ids: [E6]
    confined: false

  ollama:
    runtime_ids: "0:0"   # MEASURED 2026-10-18: /proc/1/status of the running container
    group: core
    scope: mvp
    image_var: OLLAMA
    networks: [inference]
    untrusted_input: transits
    publishable: never
    depends_on: []
    volumes: [ollama-models]
    backup: "no — model weights are re-downloadable and >90% of the bytes"
    healthcheck: "ours:ollama-tags"
    limits: { mem: 8g, cpus: "4.0", pids: 256 }
    exception_ids: []
    confined: false

  litellm:
    runtime_ids: "0:0"   # MEASURED 2026-10-18: Config.User root
    group: core
    scope: mvp
    image_var: LITELLM
    networks: [gateway, inference, data]   # + egress IFF cloud provider -> Tier B
    untrusted_input: transits
    publishable: never
    depends_on: [postgres]
    volumes: []
    backup: "no — config is in config/, state is in postgres"
    healthcheck: "ours:http-health-liveliness"
    limits: { mem: 1g, cpus: "1.0", pids: 256 }
    exception_ids: [E6]
    confined: false

  n8n:
    runtime_ids: "1000:1000"   # MEASURED 2026-10-18: the `node` user in the pinned image
    group: core
    scope: mvp
    image_var: N8N
    networks: [apps, gateway, data]        # `agents` dropped: G-AGENTS failed; no egress in the MVP
    untrusted_input: yes
    publishable: opt_in          # app route only; editor/REST/webhook-test/form never
    depends_on: [postgres]
    volumes: [n8n-data]
    backup: yes
    healthcheck: "ours:http-healthz"
    limits: { mem: 2g, cpus: "1.0", pids: 256 }
    exception_ids: []
    confined: false

  # --- knowledge ------------------------------------------------------------
  docling-serve:
    runtime_ids: "1001:0"   # MEASURED 2026-10-18: /proc/1/status of the running container
    group: knowledge
    scope: mvp
    image_var: DOCLING
    networks: [parse-owui]                 # parse-agw deferred: G-AGENTS failed
    untrusted_input: yes          # hostile documents
    publishable: never
    depends_on: []
    volumes: [docling-models]
    backup: "no — model artefacts are re-fetchable"
    healthcheck: "ours:http-health"
    limits: { mem: 4g, cpus: "2.0", pids: 256 }
    exception_ids: []
    confined: true

  # --- agents — DEFERRED, gate G-AGENTS FAILED 2026-10-18 --------------------
  # Kept in the manifest at scope `later` rather than deleted, so the publish
  # never-list, the I8 class list and the I11 zone_policy values stay at full
  # width and the group returns without anyone re-deriving them.
  agentgateway:
    group: agents
    scope: later
    gated_by: G-AGENTS
    gate_result: fail
    image_var: AGENTGATEWAY
    networks: [agents, parse-agw]
    untrusted_input: transits
    publishable: never
    depends_on: [docling-serve]
    volumes: []
    backup: "no — config is in config/, tools.lock.json is committed"
    healthcheck: "ours:http-ready"
    limits: { mem: 512m, cpus: "1.0", pids: 256 }
    exception_ids: []
    confined: false

  # --- 1.0 ------------------------------------------------------------------
  whisper-cpp:
    group: voice
    scope: "1.0"
    image_var: WHISPER
    networks: [gateway]
    untrusted_input: yes          # audio
    publishable: never
    volumes: [whisper-models]
    backup: "no — model artefacts are re-fetchable"
    healthcheck: "[A]"
    limits: { mem: 4g, cpus: "4.0", pids: 256 }
    exception_ids: [E2]           # GPU variant only
    confined: false

  kokoro:
    group: voice
    scope: "1.0"
    image_var: KOKORO
    networks: [gateway]
    untrusted_input: transits
    publishable: never
    volumes: [kokoro-models]
    backup: "no — model artefacts are re-fetchable"
    healthcheck: "[A]"
    limits: { mem: 2g, cpus: "2.0", pids: 256 }
    exception_ids: []
    confined: false

  comfyui:
    group: images
    scope: "1.0"
    image_var: COMFYUI
    networks: [ui-comfy]
    untrusted_input: yes
    publishable: never
    volumes: [comfyui-data]
    backup: "no — checkpoints are 6-15GB each and re-downloadable"
    healthcheck: "[A]"
    limits: { mem: 8g, cpus: "4.0", pids: 512 }
    exception_ids: [E2]
    confined: true

  # --- later ----------------------------------------------------------------
  searxng:      { group: web,           scope: later, networks: [untrusted-search],  untrusted_input: yes, publishable: never, confined: true }
  crawl4ai:     { group: web,           scope: later, networks: [untrusted-crawl],   untrusted_input: yes, publishable: never, confined: true, exception_ids: [E3] }
  playwright-mcp: { group: web,         scope: later, networks: [untrusted-browser], untrusted_input: yes, publishable: never, confined: true, exception_ids: [E3] }
  vllm:         { group: gpu-serving,   scope: later, networks: [inference],         untrusted_input: transits, publishable: never, confined: false }
  open-terminal: { group: code-sandbox, scope: later, networks: [ui-exec],           untrusted_input: yes, publishable: never, confined: true }
  wg-easy:      { group: remote-access, scope: later, networks: [ui-vpn],            untrusted_input: no,  publishable: opt_in, confined: false, exception_ids: [E5] }

# ---------------------------------------------------------------------------
# Helpers.  Short-lived.  Each acquires one exclusive flock on
# /run/aistack/helper.lock before starting, so at most one helper exists at any
# instant (final-design §2.1).  CI (I3) asserts no helper declares
# `restart: unless-stopped`, so the steady-state count cannot be gamed.
# ---------------------------------------------------------------------------
helpers:
  model-puller:
    scope: mvp
    image_var: OLLAMA              # same image, different command
    networks: [egress]
    untrusted_input: no            # operator-supplied model name only
    restart: "no"
    writes_volumes: [ollama-models]
  backup-helper:
    scope: mvp
    runtime_ids: "999:999"         # MEASURED: it IS the postgres image
    image_var: POSTGRES            # pg_dump from the same major version
    networks: [data]
    untrusted_input: no
    restart: "no"
  agentgateway-verify:
    scope: later
    gated_by: G-AGENTS
    gate_result: fail
    image_var: AISTACK_VERIFY
    networks: [agents]
    untrusted_input: no
    restart: "no"
    note: "runs once at `up`, must exit 0 (flow 17)"

# ---------------------------------------------------------------------------
# Volumes, and whether the nightly `local rollback backup` takes them
# (final-design §7.4).  Excluded by design and said out loud: all model volumes
# — re-downloadable, and over 90% of the bytes.
# ---------------------------------------------------------------------------
volumes:
  postgres-data:   { backup: yes, how: "pg_dump --format=custom per database + pg_dumpall --globals-only" }
  n8n-data:        { backup: yes, how: tar }
  openwebui-data:  { backup: yes, how: tar }
  caddy-data:      { backup: yes, how: tar }
  caddy-config:    { backup: no,  why: "generated from config/ on every up" }
  authelia-data:   { backup: yes, how: tar }
  ollama-models:   { backup: no,  why: "re-downloadable; >90% of the bytes" }
  docling-models:  { backup: no,  why: "re-downloadable" }
  whisper-models:  { backup: no,  why: "re-downloadable" }
  kokoro-models:   { backup: no,  why: "re-downloadable" }
  comfyui-data:    { backup: no,  why: "checkpoints are 6-15GB each and re-downloadable" }

# ---------------------------------------------------------------------------
# Publish allowlist (final-design §6).  Deferred and later services stay on the
# never-list rather than leaving it: a service that is not shipped cannot be
# published, so keeping it listed costs nothing and removing it would mean the
# list has to be re-widened on the day the group returns.
# ---------------------------------------------------------------------------
publish:
  ever:
    - open-webui
    - homepage
  never:
    - postgres
    - ollama
    - litellm
    - litellm-admin-ui
    - whisper-cpp
    - kokoro
    - docling-serve
    - agentgateway
    - comfyui
    - n8n-editor
    - n8n-rest-api
    - n8n-webhook-test
    - n8n-form
    - caddy-admin-endpoint
    - vllm
    - searxng
    - crawl4ai
    - playwright-mcp
    - open-terminal
    - wg-easy-admin-ui
    - langfuse

# ---------------------------------------------------------------------------
# Demo workflows (final-design §2.2, §10.1).
# ---------------------------------------------------------------------------
workflows:
  W1:     { scope: mvp,   title: "Research over a local preloaded corpus", needs_internet: false }
