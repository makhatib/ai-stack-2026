  what_no_agent_may_do: >-
    Approve any entry in this file or in security-exceptions.yaml, or add a
    name to security-approvers.yaml.  THE TECH LEAD IS AN AGENT AND IS COVERED
    BY THIS, which is what NOM-310 fixed in the check rather than in the prose.
    The gate's approval check was EXPECTED TO FAIL, and did, for the whole
