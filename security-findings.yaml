# AI Stack 2026 — security-findings.yaml  (NOM-301)
#
# THE VULNERABILITY DISPOSITION REGISTER.  security-exceptions.yaml covers
# deviations from the hardening anchor; this file covers CVE findings in the
# pinned images.  They are separate registers because they fail for different
# reasons and are approved against different evidence.
#
# THE CONTROL THIS FILE EXISTS TO PROVIDE:
#   `ci/scan-gate.py --dispositions security-findings.yaml` maps EVERY blocking
#   unit in the scan evidence to exactly one entry below and FAILS when any
#   unit is unclaimed.  A new CRITICAL or HIGH in a bumped image therefore
#   breaks the build instead of landing silently inside a group that happens to
#   name its package.  Package lists below are EXHAUSTIVE for that reason — no
#   wildcards, so a reviewer can see precisely what was accepted.
#
# THE UNIT OF DISPOSITION is the (image, package, installed-version) triple,
# not the CVE.  One bump or one acceptance disposes of every CVE a triple
# carries, and the CVE counts are recorded so nothing is hidden by grouping.
#
# WHAT MAKES THIS HARD, STATED PLAINLY (measured, NOM-301, 2026-10-19):
#   Every image in the candidate is ALREADY ON THE NEWEST UPSTREAM RELEASE.
#   Verified against each upstream's own release API on 2026-10-19:
#     caddy 2.11.7, authelia 4.39.28, ollama 0.40.6, open-webui v0.12.3,
#     docling-serve v1.37.0, homepage v2.6.0, agentgateway v1.6.0 — latest.
#     n8n 2.43.7 was NOT latest and HAS BEEN BUMPED to 2.44.3 (see V0).
#   So apart from V0 there is NO PIN CHANGE that removes these findings.  They
#   are unfixed upstream, unfixed by the distro, or not reachable.  That is why
#   the residue needs named approval rather than another bump, and it is why
#   none of the entries below claims a fix it cannot point at.
#
# NO AGENT MAY APPROVE AN ENTRY HERE — THE TECH LEAD INCLUDED.  These three
# lines used to end "until the Tech Lead decides", which named an agent as the
# approver and contradicted the `what_no_agent_may_do` field in the same file;
# both gates would also have ACCEPTED the literal string "Tech Lead" [NOM-310].
# The authority is now a named human, recorded once in security-approvers.yaml,
# and ci/approvers.py refuses every agent of this company BY NAME.  Every
# `approved_by` here now carries that human's name, written on 2026-10-20
# after he named himself on a human-only question card [NOM-310].  The
# gate's approval check FAILED for the whole life of this register and
# passes for the first time with this commit.  That failure was the control
# working; this pass is not a defect routed around, it is the thing the
# control was waiting for.
#
# THE FIGURES ARE NOW THE CORRECTED ONES [NOM-341] and they are no longer
# merely written down: `ci/scan-gate.py` fails when any entry's declared
# `units` / `critical_units` differ from what it measures for that entry's own
# (image, package) set, and when the per-entry sum differs from the header.
# Before that, the only thing that caught a wrong count was a human reading
# the file — V6 declared 62 against 77 and V10 declared 21 against 22 while
# the coverage check stayed green.  See `approval:` at the end of this file.

schema: aistack.security-findings.v1
version: 1

candidate:
  issue: NOM-301
  measured_on: 2026-10-19
  corrected_on: 2026-10-20
  corrected_by_issue: NOM-341
  measured_by: "DevOps Engineer (agent) — evidence only, NOT an approval"
  evidence_dir: security-report-nom341-20261020T175630Z
  evidence_dir_note: >-
    ONE directory for the whole pin set, which is new in NOM-341 and is the
    reason every figure below can name a single scan.  Before this the figures
    came from three directories at once (c2 for eight images, bump for n8n,
    agw for agentgateway) and the gate had to be handed all three — and when
    it was handed `security-report-*/` instead, a trivy-only docling RECHECK
    with no grype shadowed the full c2 scan of the same digest and the total
    read 131 instead of 203 with every unit still "claimed".  The nine
    unchanged digests were carried into this directory unmodified and POSTGRES,
    the one pin that moved, was scanned fresh here.  ci/scan-gate.py now
    prefers the more complete scan of a digest over the last one listed, so
    the shadowing cannot recur.
  severity_convention: vendor
  severity_convention_note: >-
    The distro's / upstream's own severity, i.e. trivy's.  grype also runs and
    its NVD-derived score is HARSHER on 76 units the distro assessed and scored
    lower; those are COUNTED in the gate's `dis-up` column and NOT adopted,
    because the distro knows its own build flags and defaults and NVD does not.
    The one place grype's severity IS used is the Docling OS layer, where trivy
    has no data source at all and there is therefore no distro verdict to
    prefer — see V9.
  totals_after_V0_bump:
    blocking_units: 205
    critical_units: 17
    high_units: 188
    blocking_cve_instances: 1009
  totals_note: >-
    THESE FIGURES MOVED IN NOM-341 AND THEY ARE NOW ASSERTED, NOT ASSERTED-OF.
    They read 203 / 23 / 180 / 1049 and were wrong in two independent ways.
      * The per-entry `units` summed to 187, not 203 [NOM-309].  V6 declared
        62 against 77 measured and V10 declared 21 against 22; 187 + 15 + 1 =
        203 was the whole of the gap.  Nothing in CI compared the two numbers,
        so a human reading the file was the only control.
      * The Debian 13 Postgres base was then APPLIED (V7), which re-measured
        POSTGRES from 28 units / 8 CRITICAL to 30 / 2.
    THE DIRECTION OF THE CORRECTION MATTERS: the per-entry declarations were
    corrected FROM THE SCAN, and this header then moved to meet their sum.  It
    was not balanced the other way round.  `ci/scan-gate.py` now fails when a
    declared per-entry figure differs from what it measures for that entry's
    own packages, and when the per-entry sum differs from this block — so the
    arithmetic that was wrong here cannot be wrong again silently.
    CRITICAL fell 23 -> 17 and HIGH rose 180 -> 188: the trixie swap is a
    TRADE, as V7 said it was, not a strict improvement.
  coverage:
    images_pinned: 10
    images_scanned_at_exact_pinned_digest: 10
    os_layer_covered: 10
    grype_second_opinion: 10
    syft_sbom: 10
    note: >-
      AGENTGATEWAY was pinned but ABSENT from the NOM-258 scan set and was
      therefore an unmeasured image, not a clean one.  NOM-301 scanned it:
      0 blocking units.  The gate now derives its image list from versions.env
      rather than from a hand-written images.txt, so a pin can no longer be
      omitted without failing.

