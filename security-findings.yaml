  - id: V7
    title: "pgvector perl/sqlite/zlib CRITICALs — a Debian 13 base would clear six of eight"
    disposition: accepted-pending-decision
    images: [POSTGRES]
    packages: [libperl5.36, perl, perl-base, perl-modules-5.36, stdlib, libpcre2-8-0]
    severity: "CRITICAL and HIGH"
    units: 6
    critical_units: 5
    measured_alternative:
      pin: "docker.io/pgvector/pgvector:0.8.7-pg17-trixie@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84"
      evidence: "security-report-bump-20261019T060718Z"
      result: >-
        CRITICAL units 8 -> 3, HIGH 20 -> 28.  Clears the whole perl family plus
        libsqlite3-0 and zlib1g; leaves libxml2 and the Go stdlib unit.  It is a
        genuine TRADE, not a strict improvement: five fewer CRITICAL, eight more
        HIGH.
    why_not_applied: >-
      It changes the base OS from Debian 12 to Debian 13.  That is a shape
      change to the data tier, not a patch, and it carries a glibc collation
      change that can invalidate existing text indexes on a cluster created
      under the old locale data.  For a fresh MVP install that is a non-issue;
      for anything already holding data it is a REINDEX, and that is a decision
      about operations, not security.  Applying it unilaterally inside a
      security ticket would be the wrong call, so it is MEASURED AND PROPOSED
      here instead.
    recommendation: >-
      Take it for the MVP, which installs fresh.  Do not take it as an in-place
      upgrade path without a reindex plan.
    decision_owner: "Tech Lead"
    approved_by: PENDING
    approved_at: null
    review_by: 2027-04-17
    reviewer_requested: "Tech Lead — this one needs a yes/no, not just a sign-off"

  - id: V8
    title: "Go toolchain and golang.org/x/* compiled into Caddy, Authelia and Ollama"
    disposition: accepted-upstream-rebuild-only
    images: [AUTHELIA, CADDY, OLLAMA]
    packages:
      - stdlib
      - golang.org/x/net
      - golang.org/x/crypto
      - golang.org/x/text
      - golang.org/x/mod
      - golang.org/x/image
      - github.com/buger/jsonparser
    severity: HIGH
    units: 11
    cve_instances: 56
    reachable: partly
    why_reachable: >-
      For Caddy and Authelia the affected package is net/http and x/net, which
      IS the hot path — these are HTTP servers.  We say so rather than claiming
      a TLS-terminating proxy is unaffected by an HTTP library CVE.  For Ollama
      the x/crypto and x/image findings sit in code paths the stack does not
      drive, but it is on an unpublished internal network either way.
    why_no_fix: >-
      A Go binary embeds its toolchain and module versions at BUILD time.
      There is no runtime upgrade; the only fix is an upstream rebuild.  All
      three images are already at their newest release (caddy 2.11.7,
      authelia 4.39.28, ollama 0.40.6, each confirmed latest on 2026-10-19),
      so there is no pin that improves this today.
    severity_note: >-
      Zero of these are CRITICAL under the vendor convention.  grype reads 7 of
      them as CRITICAL from NVD scores; that disagreement is counted by the gate
      and not adopted.
    containment: >-
      Caddy is the only service with published ports and holds exactly one
      capability (NET_BIND_SERVICE, exception E1).  Authelia and Ollama publish
      nothing.  Ollama is on the inference network with no egress attachment.
    residual: >-
      A Go net/http CVE affecting Caddy is exposed to the internet by
      definition.  That is the single largest unmitigated residual in the stack
      after V4, and no amount of container hardening changes it.
    required_action: "bump on the first upstream release built against a fixed Go toolchain"
    approved_by: PENDING
    approved_at: null
    review_by: 2027-04-17
    reviewer_requested: "Tech Lead"

  - id: V9
    title: "Docling CentOS Stream 9 OS layer — the gap NOM-259 flagged, now measured"
    disposition: accepted-no-fix-we-can-apply
    images: [DOCLING]
    severity: HIGH
    units: 75
    critical_units: 0
    cve_instances: 273
    how_the_gap_was_closed: >-
      trivy has NO DATA SOURCE for CentOS Stream: it identifies the OS, logs
      `WARN Unsupported os family="centos-stream"`, returns NO os-pkgs result,
      and still exits 0.  Commit 9042e0c made the scanner refuse to call that
      silence clean.  NOM-301 closes it with a scanner that does have a source:
      grype resolves `ID=centos VERSION_ID=9` onto the Red Hat feed
      (`redhat:distro:redhat:9`) and returned 2133 rpm matches — 0 CRITICAL,
      267 HIGH, 1088 MEDIUM, 769 LOW, 9 NEGLIGIBLE.  The appearance of
      NEGLIGIBLE, which NVD does not use, is how we know these carry Red Hat's
      OWN severities rather than generic NVD scores.
    the_honest_caveat: >-
      CentOS Stream 9 is UPSTREAM of RHEL 9, so Red Hat's fixed-version numbers
      do not always correspond to a Stream package that exists.  The SEVERITIES
      are the vendor's and are sound; individual `fix` strings should be treated
      as indicative.  This is real coverage, not equivalent coverage, and we
