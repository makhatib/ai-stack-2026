      - ffmpeg
      - gnupg
      - gnupg-l10n
      - gpg
      - gpg-agent
      - gpgconf
      - gpgsm
      - gzip
      - libacl1
      - libavcodec59
      - libavdevice59
      - libavfilter8
      - libavformat59
      - libavutil57
      - libblkid1
      - libcjson1
      - libcurl3-gnutls
      - libcurl4
      - libexpat1
      - libharfbuzz0b
      - libjxl0.7
      - liblastlog2-2
      - libldap-2.5-0
      - libmariadb-dev
      - libmariadb3
      - libmfx1
      - libmount1
      - libncursesw6
      - libpostproc56
      - librsvg2-2
      - libsmartcols1
      - libsndfile1
      - libssh-gcrypt-4
      - libssl-dev
      - libssl3
      - libswresample4
      - libswscale6
      - libsystemd0
      - libtiff6
      - libtinfo6
      - libudev1
      - login
      - libuuid1
      - libx11-6
      - libx11-data
      - libx11-xcb1
      - libxrender1
      - mariadb-common
      - mount
      - ncurses-base
      - ncurses-bin
      - openssl
      - util-linux
      - util-linux-extra
    excluded_deliberately: >-
      The perl family is NOT in this entry.  It appears in BOTH images but with
      DIFFERENT facts — CRITICAL with a fix in postgres (V7), HIGH with no fix
      in open-webui (V11) — so one shared entry would have had to state one of
      them wrongly.  The gate's ambiguity check is what surfaced this.
    why_no_fix: >-
      Debian has published no fixed version for these in bookworm.  trivy
      reports no FixedVersion and grype reports no fix version, from both
      scanners independently.  There is no `apt upgrade` and no newer image tag
      that resolves them, because both images are already at their newest
      upstream release.  "No fix available" is a measured field here, not a
      guess.
    reachable: mixed
    reachability_note: >-
      Honestly mixed and not individually triaged, which is itself the
      disposition: these are base-OS libraries, some genuinely in the request
      path (libssl3, libcurl4, libxml2) and many not (libx11, mesa, mariadb
      client in an image that talks to postgres).  We do NOT claim a
      per-package reachability result we did not establish.
    containment: >-
      Both images: cap_drop ALL, no-new-privileges, read_only root filesystem,
      no published ports (postgres is never published; open-webui only through
      Caddy + Authelia), pids_limit, and a non-default network attachment.
    residual: >-
      STATED IN FULL: a remote-code-execution path through one of the reachable
      libraries would execute inside the container with those restrictions.
      Containment reduces what that buys an attacker; it does not prevent the
      initial execution, and we do not claim it does.
    the_only_real_fix: >-
      a smaller base image upstream.  "or a Debian 13 base — see V7" was the
      other half of this sentence and IT HAS NOW BEEN TAKEN: POSTGRES is pinned
      to the trixie base as of NOM-341.  That did not empty this entry, it
      RESHAPED it — on Debian 12 this entry's postgres half included
      libsqlite3-0 and zlib1g as CRITICALs with no fix, and both are gone;
      Debian 13 brings gnupg, the gpg tool family, login and liblastlog2-2 in
      with no fix of their own.  MEASURED, this entry's postgres half only:
      22 units / 3 CRITICAL / 19 HIGH on bookworm -> 24 / 1 / 23 on trixie.
      Two fewer CRITICAL, four more HIGH.  There is no third base to move to.
    what_changed_in_NOM-341: >-
      `units` read 62 and `critical_units` read 9.  Measured on the SAME
      evidence NOM-301 wrote, this entry already claimed 77 units and 10
      CRITICAL [NOM-309] — the declaration was simply never compared to the
      scan by anything.  It now declares 79 / 8, which is what it measures
      against security-report-nom341-20261020T175630Z after the trixie swap,
      and ci/scan-gate.py fails if that ever stops being true.  The number
      moved for two unrelated reasons at once and both are stated so neither
      hides the other: +17 from correcting the declaration, -15 CRITICAL-and-
      HIGH churn and +9 new no-fix packages from the base change.
    approved_by: "Mahmoud Alkhatib"
    approved_at: 2026-10-20
    review_by: 2027-04-17
    reviewer_requested: "Tech Lead"

  - id: V7
    title: "Debian 13 Postgres base — APPLIED; what it did not clear"
