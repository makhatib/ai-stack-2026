# APPLIED FIX
# ---------------------------------------------------------------------------
dispositions:

  - id: V0
    title: "n8n 2.43.7 -> 2.44.3"
    disposition: fixed
    images: [N8N]
    packages:
      - openssh
      - openssh-client-common
      - openssh-client-default
      - openssh-keygen
      - openssh-server
      - openssh-server-common
      - openssh-sftp-server
      - graphicsmagick
    measured: >-
      CRITICAL units 10 -> 3, HIGH 8 -> 5, blocking CVE instances 46 -> 14.
      The bump clears all seven openssh units (Alpine 10.3_p1-r0 -> r1) and the
      graphicsmagick unit.  No new CRITICAL package appears.  Measured on the
      exact bump digest, not inferred from the version number.
    evidence: "security-report-bump-20261019T060718Z"
    pin_after: "docker.io/n8nio/n8n:2.44.3@sha256:5032941f437e1daa421cad0cc3ea57cd054f0d44a7256b38a0a3fca1b460834a"
    approved_by: n/a
    note: "A fix needs no exception. Listed so the gate can account for the packages it removed."

# ---------------------------------------------------------------------------
# NOT REACHABLE — the vulnerable code cannot execute in this deployment.
# These are the only entries that claim a finding does not apply, and each
# names the structural reason rather than asserting low risk.
# ---------------------------------------------------------------------------

  - id: V1
    title: "linux-libc-dev — kernel headers, not a kernel"
    disposition: not-reachable
    images: [OPEN_WEBUI]
    packages: [linux-libc-dev]
    severity: CRITICAL
    units: 1
    cve_instances: 216
    why_not_reachable: >-
      linux-libc-dev ships the kernel's userspace HEADERS for compiling against.
      It contains no executable kernel code and loads no module.  The container
      runs the HOST's kernel, so the CVEs listed against this package describe
      code that is not present in the image's execution path at all.  The two
      CRITICALs are ksmbd (the in-kernel SMB server) and a gcov concurrency bug
      — neither is reachable from a container that cannot load kernel code.
    the_real_control: >-
      Host kernel patching on the Proxmox host, which is a HOST obligation and
      is NOT satisfied by this image's contents either way.  This entry disposes
      of the finding against the image; it does not claim the host is patched.
    residual: >-
      None from the image.  If the host kernel is unpatched, that is a live
      risk, tracked where it belongs rather than here.
    fix_available_upstream: "6.1.190-1 — irrelevant to reachability; would only change the header version"
    approved_by: PENDING
    approved_at: null
    review_by: 2027-04-17
    reviewer_requested: "Tech Lead"

  - id: V2
    title: "chromadb pre-auth RCE — no Chroma listener exists"
    disposition: not-reachable
    images: [OPEN_WEBUI]
    packages: [chromadb]
    severity: CRITICAL
    units: 1
    cve_instances: 4
    why_not_reachable: >-
      CVE-2026-45829 and CVE-2026-45833 are PRE-AUTHENTICATION code execution
      in ChromaDB's HTTP SERVER.  Open WebUI uses Chroma as an in-process
      library, not as a service: no chroma container exists in compose.yaml, no
      Chroma port is published, and nothing in the stack opens Chroma's API.
      There is no listener for a pre-auth request to arrive at.
    residual: >-
      STATED IN FULL: the library code is still in the image.  Anything that
      already has code execution inside open-webui could call it directly, but
      such an attacker does not need a Chroma CVE.  The pre-auth property —
      which is what makes these CRITICAL — does not apply.
    fix_available_upstream: none
    verify: "compose.yaml declares no chroma service and no chroma port"
    approved_by: PENDING
    approved_at: null
    review_by: 2027-04-17
    reviewer_requested: "Tech Lead"

  - id: V3
    title: "n8n bundled git/template libraries — no shipped workflow reaches them"
    disposition: not-reachable-as-shipped
    images: [N8N]
    packages: ["@simple-git/argv-parser", simple-git, handlebars]
    severity: CRITICAL
    units: 3
    cve_instances: 6
    why_not_reachable: >-
      These are reached through n8n's Git node and template rendering.  CHECKED,
      not assumed, and CORRECTED on 2026-10-19: all four shipped workflow files
      (W1-W4 — three executable, W2 deferred by NOM-321/NOM-323, but its file
      still ships and is still imported) use httpRequest, postgres, set,
      readWriteFile, manualTrigger, scheduleTrigger, webhook — and `code`.  No
      git, ssh or executeCommand node appears anywhere in workflows/*.json.

      The `code` nodes are new as of NOM-302, and an earlier revision of this
      line claimed there were none, which was wrong the moment the templates
      were rewritten.  It does not change the disposition, and that is MEASURED
      rather than reasoned: a probe workflow whose code node calls require()
      for each package was imported, executed and deleted, and n8n's sandbox
      refused all four attempts —

        handlebars    -> DENIED: Module 'handlebars' is disallowed
        simple-git    -> DENIED: Module 'simple-git' is disallowed
        fs            -> DENIED: Module 'fs' is disallowed
        child_process -> DENIED: Module 'child_process' is disallowed

      That holds because NODE_FUNCTION_ALLOW_EXTERNAL and
      NODE_FUNCTION_ALLOW_BUILTIN are unset in this stack (measured in the
      running container, not read off a compose file).  Setting either one
      reopens this disposition and must re-run this probe.

      The disposition covers the files on disk, so W2's deferral does not
      narrow it: a deferred template is still a template an operator can open
      and run by hand.  The one
      route that is deliberately NOT behind Authelia, /n8n/webhook/*, reaches
      only W4, which is httpRequest + postgres.  The editor and REST API, which
      are what it would take to ADD a Git node, are behind Authelia forward_auth
      and the REST API is additionally 404'd at the edge.
    residual: >-
      STATED IN FULL: this disposition is about the SHIPPED workflow set, not
      about the image.  An operator who builds a workflow passing webhook input
      into a Git node makes these reachable pre-auth.  An operator who can do
      that already has the Code node and therefore arbitrary execution inside
      n8n, so the CVEs grant no privilege they lacked — but the pre-auth
      property WOULD be new, and that is the part worth watching.
    fix_available_upstream: "simple-git 4.0.1, argv-parser 2.0.1, handlebars 4.7.10 — all bundled inside n8n; not independently pinnable"
    recheck_when: "a workflow adds a git, ssh, executeCommand or code node"
    approved_by: PENDING
    approved_at: null
    review_by: 2027-04-17
    reviewer_requested: "Tech Lead"

# ---------------------------------------------------------------------------
# REACHABLE, NO FIX WE CAN APPLY — accepted under containment, with the
# residual risk written out.  These are the entries that actually need a
# decision from a human.
# ---------------------------------------------------------------------------

  - id: V4
    title: "PyJWT authentication bypass in Open WebUI — THE MOST SERIOUS RESIDUAL"
    disposition: accepted-under-containment
    images: [OPEN_WEBUI]
    packages: [PyJWT, pyjwt]
    severity: CRITICAL
    units: 1
    cve_instances: 6
    headline_cve: "CVE-2026-102268 — authentication bypass via improper public key validation"
    reachable: yes
    why_reachable: >-
      Open WebUI validates its own session and API tokens with PyJWT.  That code
      is in the request path of every authenticated route, so this is NOT a
      dormant library.
    containment: >-
      VERIFIED in config/caddy/sites.d/10-open-webui.caddy: all four route
      groups — /, /api/*, /ws/* and the upload matcher — carry
      `forward_auth authelia:9091`.  An unauthenticated request never reaches
      open-webui's JWT code; an attacker must first hold a valid Authelia
      session.  Open WebUI is one of exactly two publishable surfaces, so this
      is the whole of the network containment.
    residual: >-
      STATED IN FULL AND NOT MINIMISED: a user who has passed Authelia can use
      this to forge or escalate an Open WebUI identity.  In a single-operator
      MVP the population that can do this is the operator, so the practical
      privilege gain is small — but the stack is intended for a team, and the
      moment a second non-admin account exists this becomes a real privilege
      escalation between users.  Accepting it is a decision about the operating
      model, not just about a CVE.
    fix_available_upstream: >-
      PyJWT 2.14.0 fixes it, but it is a transitive dependency inside
      open-webui v0.12.3, which IS the newest release (published 2026-10-16).
      There is no pin that resolves this today.
    required_action: >-
      Track upstream for the first open-webui release carrying PyJWT >= 2.14.0
      and bump on sight.  This entry is the reason that watch exists.
    expires_on: "the first open-webui release with PyJWT >= 2.14.0"
    operating_cap:
      decision: >-
        ACCEPTED by Mahmoud Alkhatib on 2026-10-20 [NOM-310], as a standing
        constraint and not as a note: the MVP runs SINGLE-OPERATOR, or with
        ADMIN-ONLY accounts, until an open-webui release carries
        PyJWT >= 2.14.0.
      what_it_forbids: >-
        Creating a SECOND NON-ADMIN Open WebUI account while this entry is
        open.  Every account that exists can already forge an Open WebUI
        identity; the cap is what keeps that inside one trust level instead of
        across two.  It does not reduce the CVE and is not claimed to.
      exit_condition: "the first open-webui release with PyJWT >= 2.14.0"
      NOT_ENFORCED_IN_CODE: >-
        No check asserts the account count.  Open WebUI owns its own user table,
        CI does not read a running instance, and nothing in this repository
        will fail if a second account is created tomorrow.  WHO WILL STILL BE
        RUNNING: an operator who adds a user and never reads this entry.  The
        cap is a promise by the operator, carried here and in
        docs/security-faq.md ("Can I add a second user?"), and a reviewer
        should treat it as exactly that strength and no more.
    approved_by: PENDING
    approved_at: null
    review_by: 2027-04-17
    reviewer_requested: "Tech Lead — flagged as the one finding worth reading in full"

  - id: V5
    title: "Open WebUI RAG libraries with an upstream fix we cannot pin"
    disposition: accepted-under-containment
    images: [OPEN_WEBUI]
    packages: [sentence-transformers, unstructured]
    severity: CRITICAL
    units: 2
    cve_instances: 2
    cves:
      - "CVE-2026-68770 sentence-transformers RCE via security-control bypass (fix 5.6.0)"
      - "CVE-2026-71428 unstructured SSRF in URL-based partitioning (fix 0.24.0)"
    reachable: conditionally
    why_reachable: >-
      sentence-transformers executes model code, so it is reachable when a model
      is loaded from an untrusted source.  The stack loads embedding models
      through Ollama from pinned names, not arbitrary URLs.  `unstructured`
      SSRF is reachable through RAG ingestion of a URL, which an authenticated
      user can supply.
    containment: >-
      Authelia in front of every open-webui route (same evidence as V4); the
      egress network is a separate attachment rather than the default bridge,
      so an SSRF reaches only what that attachment can reach.
    residual: >-
      An authenticated user can aim the SSRF at whatever the egress attachment
      permits.  We do not claim the attachment makes it harmless.
    fix_available_upstream: "both fixed upstream, both transitive inside open-webui v0.12.3 (latest)"
    approved_by: PENDING
    approved_at: null
    review_by: 2027-04-17
    reviewer_requested: "Tech Lead"

