approval:
  state: SIGNED on 2026-10-20 by the named human [NOM-310]
  who_must_approve: "Mahmoud Alkhatib"
  who_must_approve_is: >-
    A HUMAN.  The exact string above is what `approved_by` must equal, and it
    must match an entry in security-approvers.yaml, which carries his role and
    the scope he was asked about.  This field used to read "Tech Lead" — an
    agent, and the same file's `what_no_agent_may_do` forbade exactly that.
  authority_record: NOM-310
  authority_settled_on: 2026-10-20
  how_the_authority_was_settled: >-
    NOM-309 reviewed all 18 entries and concluded the Tech Lead could not sign
    them.  NOM-310 put the question to a HUMAN-ONLY question card, which the
    board user answered on 2026-10-20: he named HIMSELF as the approver, and
    chose "keep the rule: no agent signs — tighten the check so it rejects
    'Tech Lead' too" over amending the check to admit an agent reviewer.
  what_the_check_now_does: >-
    ci/approvers.py holds one rule for both registers, called by
    ci/scan-gate.py and by ci/invariants.py I9.  It has two halves and both
    must pass: the value must name NO agent of this company (the roster is in
    code, so a register edit cannot widen it), AND it must exactly equal a
    name on security-approvers.yaml that declares `human: true` and cites the
    issue where a human named them.  tests/approval-authority.sh exercises
    every agent name, the old "Tech Lead" gap, and the strings that used to
    pass for an approval ("the team", "approved", "ok").
    WHAT IT DOES NOT ESTABLISH: that the named person consented.  Nothing in a
    repository can.  `authority_record` is the citation a human follows.
  why_approved_by_was_PENDING_until_2026_10_20: >-
    IT IS NO LONGER PENDING.  Every approvable entry now reads `approved_by:
    "Mahmoud Alkhatib"` with `approved_at: 2026-10-20`.  It stayed PENDING
    through TWO tickets after the authority was settled, deliberately: the
    figures were wrong by a known amount, and a signature certifying
    arithmetic the evidence does not support is worse than no signature at
    all.  The figures were corrected first [NOM-341], and that sequencing is
    now a control rather than a promise -- ci/scan-gate.py fails when a
    declared figure disagrees with what it measures, so this file can no
    longer carry an approval over arithmetic that does not hold.
    WHAT WAS WRONG, kept here because the correction is only auditable next to
    it: V6 declared `units: 62` against 77 measured, V10 declared 21 against
    22, and the per-entry units summed to 187 against a header total of 203
    (187 + 15 + 1 = 203, the whole of the gap) [NOM-309].  The Tech Lead then
    decided YES on the Debian 13 Postgres base, which re-measured V6, V7, V11
    and the totals.
    WHAT IS TRUE NOW: every approvable entry declares `units` and
    `critical_units`, each equals what ci/scan-gate.py measures for that
    entry's own packages, the per-entry sum equals the header, and the header
    equals the scan — all four asserted on every gate run against
    security-report-nom341-20261020T175630Z, not asserted in prose here.  The
    approval check was the gate's last remaining failure and the signature
    cleared it: against that report and this file, ci/scan-gate.py exits 0.
    A failure of that check from here on is a REGRESSION rather than the
    pre-signature state, and the gate's own output says so.  Who signs never
    depended on those numbers, which is why it was settled in parallel
    [NOM-310].
  already_decided_on_NOM-310: >-
    The V4 operating cap is ACCEPTED — the MVP runs single-operator or
    admin-only until open-webui ships PyJWT >= 2.14.0.  See V4's
    `operating_cap`, including the part that is not enforced in code.
  what_they_are_approving: >-
    The dispositions above for the 17 CRITICAL and 188 HIGH blocking units that
    remain after the n8n bump AND the Debian 13 Postgres base, on the
    understanding that every image is already at its newest upstream release
    and no further pin change removes them.
    THIS KEY APPEARED TWICE IN THIS FILE until NOM-341 — once saying "the
    CRITICAL and HIGH blocking units" and once saying "the 23 CRITICAL and 180
    HIGH".  YAML keeps the LAST of two duplicate keys, so the specific stale
    figures were the live value and the sentence warning that the counts were
    about to be corrected was the one being discarded.  Two keys with one name
