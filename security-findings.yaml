non_vulnerability_findings:

  - id: M1
    kind: misconfiguration
    count: 16
    disposition: not-applicable-to-this-deployment
    what_they_are: >-
      All 16 come from source trees that upstream images happen to SHIP, not
      from any configuration this stack applies:
        * 5 in n8n, against the `isolated-vm` npm package's own
          Dockerfile.alpine / Dockerfile.debian — build files for a dependency
          that are never executed at runtime (DS-0002 root user,
          DS-0025 apk --no-cache, DS-0026 no HEALTHCHECK).
        * 2 in litellm, against its own Dockerfile.build_from_pip (same checks).
        * 9 in litellm, against `enterprise/cloudformation_stack/litellm.yaml`
          — an AWS CloudFormation template for a deployment model we do not use
          (AWS-0180 RDS publicly accessible, AWS-0080/0131 unencrypted storage,
          AWS-0028/0130 IMDS tokens, AWS-0077/0133/0176/0177).
    why_not_applicable: >-
      None of these files is read by anything at runtime, and the AWS ones
      describe infrastructure that does not exist in a self-hosted Proxmox
      deployment.  The DS-0002 "image user should not be root" hits are against
      DEPENDENCY Dockerfiles, not against the images' actual runtime user —
      that question is governed by compose.yaml and exception E2 and is probed
      separately.
    approved_by: PENDING
    review_by: 2027-04-17

  - id: S1
    kind: secret
    count: 1
    disposition: not-a-credential-of-ours
    what_it_is: >-
      trivy's `jwt-token` rule fired at line 528 of
      /opt/app-root/lib/python3.12/site-packages/skimage/data/_fetchers.py in
      the docling image — scikit-image's sample-data fetcher.  MEDIUM.
    why_not_a_credential: >-
      It is a token embedded in a third-party library's public sample-data
      fetching code, shipped identically to every scikit-image user.  It
      authenticates nothing belonging to Nomad AI and grants no access to this
      stack.  THE VALUE WAS NOT PRINTED, copied, or recorded anywhere in this
      repo or in the issue thread, and must not be.
    action: none
    approved_by: PENDING
    review_by: 2027-04-17

# ---------------------------------------------------------------------------
# COVERAGE LIMITS.  What the evidence does NOT establish.  A scanner that
# looked at nothing reports zero, and zero is not an answer.
# ---------------------------------------------------------------------------
coverage_limits:

  - id: L1
    subject: "repository misconfiguration scanning"
    claim_NOT_made: "that the shipped configuration is free of misconfigurations"
    what_actually_happened: >-
      `trivy fs --scanners misconfig,secret` over the source tree reported
      `Detected config files num=0` and returned no results.  That is NOT a
      clean result — it is NO COVERAGE.  trivy's misconfig scanner analyses
      Dockerfiles, Kubernetes manifests, Terraform, CloudFormation and Helm.
      This repo ships NONE of those: `find` for Dockerfile*, *.tf, Chart.yaml
      and k8s paths returns nothing.  What the repo does ship — compose.yaml,
      the Caddyfile and sites.d/*.caddy, authelia/configuration.yml,
      litellm/config.yaml, homepage/*.yaml, limits.yaml — are formats trivy
      does not analyse.  So trivy examined zero of the files that matter.
    what_IS_the_control: >-
      `ci/invariants.py`, which asserts the stack's own invariants (published
      ports, capability sets, auth on every route, banned strings) directly
      against those files.  That is the real config control; trivy's zero says
      nothing either way and is recorded here so nobody later cites it as
      evidence of a clean configuration.
    secret_scanning_DID_run: >-
      By contrast the SECRET scanner is content-based and did process the tree
      (it logged size warnings on individual report files as it went) and found
      zero secrets in the repo.  That zero IS a result.

  - id: L2
    subject: "signature verification"
    claim_NOT_made: "that any image signature was verified"
    status: >-
      cosign is not installed on AI-Sandbox and was NOT run.  Digest pinning is
      the supply-chain control; signature verification remains UNATTEMPTED, as
      versions.env already states.  Unattempted is recorded as unattempted.

  - id: L3
    subject: "per-package reachability inside V6"
    claim_NOT_made: "that each of the 62 Debian base-package findings was individually traced"
    status: >-
      V6 is dispositioned as a group under containment, with its mixed
      reachability stated rather than resolved.  A per-package reachability
      result for 62 base libraries was not produced and is not claimed.

