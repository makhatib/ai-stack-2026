# AI Stack 2026 — MVP compose.
#
# GENERATED-FROM: manifest.yaml.  Edit the manifest, then re-run
# `aistack manifest render` and the CI invariants in ci/.  A service, bridge or
# count that exists here and not there fails the PR (I1, I1b, I3, I11).
#
# SCOPE (v2, NOM-413): core 14 + knowledge 1 + tracing 5 = 20 containers.
# The MVP was core 8 + knowledge 1 = 9.  The `agents` group is NOT here:
# gate G-AGENTS failed on 2026-10-18 against the pinned agentgateway digest
# (see gate/G-AGENTS-result.json), so per final-design §0.1/§2.1/F4 it leaves
# both the MVP and 1.0.
#
# TIER A.  This file makes NO containment claim.  `internal: true` removes a
# bridge's default route and masquerade, which is why nothing on one has a NAT'd
# path to the internet.  It is NOT a claim about the LAN, about CGNAT or
# link-local metadata addresses, about host services listening on 0.0.0.0 or ::,
# or about a container connecting back to another member of its own /29.  Those
# are Tier B and need the host firewall rules, which this file does not install
# and the MVP does not require.

name: aistack

# ---------------------------------------------------------------------------
# The hardening anchor (final-design §5.6).  EVERY service merges this.  Every
# deviation is an entry in security-exceptions.yaml that a reviewer can grep
# for — there are no quiet overrides.
# ---------------------------------------------------------------------------
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ===========================================================================
  # core — no profile key, always runs
  # ===========================================================================

  caddy:
    <<: *hardened
    image: ${CADDY_IMAGE:?pin missing}:${CADDY_TAG:?pin missing}@${CADDY_DIGEST:?pin missing}
    container_name: aistack-caddy
    # THE ONLY SERVICE IN THE STACK THAT DECLARES `ports:` (I2).
    # Bound to an explicit address, never 0.0.0.0 — the installer writes
    # AISTACK_BIND_ADDR and refuses to write a wildcard.
    ports:
      - "${AISTACK_BIND_ADDR:?bind address missing}:443:443"
      - "${AISTACK_BIND_ADDR:?bind address missing}:80:80"
    # E1: one capability, to bind 443 as non-root.  Nothing else.
    cap_add: [NET_BIND_SERVICE]
    networks: [edge, apps]
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/sites.d:/etc/caddy/sites.d:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      AISTACK_HOSTNAME: ${AISTACK_HOSTNAME:?hostname missing}
    depends_on:
      authelia:
        condition: service_healthy
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      # `caddy validate` proves the running config parses AND that the admin
      # endpoint is off, which an HTTP 200 would not.
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  authelia:
    <<: *hardened
    image: ${AUTHELIA_IMAGE:?pin missing}:${AUTHELIA_TAG:?pin missing}@${AUTHELIA_DIGEST:?pin missing}
    container_name: aistack-authelia
    # NO `cap_add` AT ALL, and that took measuring rather than assuming.
    #
    # The official entrypoint ends with:
    #   if [ -n "$$1" ] && [ "$$1" != "--config" ]; then exec "$$@"
    #   elif [ "$$(id -u)" != 0 ] ...; then exec authelia "$$@"
    #   else chown -R ... /config; exec su-exec ... authelia "$$@"; fi
    #
    # The default path takes the LAST branch: it chowns /config (which is a
    # read-only mount, so it logs four errors) and then calls su-exec, which
    # needs CAP_SETUID and CAP_SETGID and dies with
    # "su-exec: setgroups(0): Operation not permitted" without them.
    #
    # Passing an explicit command whose first word is not `--config` takes the
    # FIRST branch instead: a plain exec, as the user we are already running
    # as. No chown, no su-exec, and therefore NO CAPABILITIES — strictly less
    # privilege than granting the two that make the default path work.
    command: ["authelia", "--config", "/config/configuration.yml"]
    networks: [edge, apps, data]
    volumes:
      - ./config/authelia/configuration.yml:/config/configuration.yml:ro
      - ./config/authelia/users.yml:/config/users.yml:ro
      - authelia-data:/data
      # MEASURED: Authelia writes /app/.healthcheck.env at startup so that
      # `authelia health` knows its own scheme, host and port. Under
      # `read_only: true` that write fails and the process exits during
      # startup checks — and it does NOT say so: the only log line is
      # "Errors occurred performing startup checks" with a Go stack.
      #
      # A tmpfs cannot be mounted at a file path, and a tmpfs over /app would
      # hide the binary, so this is a writable bind of one file.
      - ./.runtime/authelia-healthcheck.env:/app/.healthcheck.env
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    # Authelia supports _FILE indirection for every secret it needs, so none of
    # them is an environment variable and none is in .env (E6 covers only
    # open-webui and litellm, which do not).
    # Authelia's pinned image runs as root (Config.User is empty and there is
    # no entrypoint privilege drop), so 0:0 is correct here and is RECORDED
    # rather than defaulted.  config/image-facts.yaml carries the measurement.
    secrets:
      - source: authelia_jwt_secret
        uid: "0"
        gid: "0"
        mode: 0400
      - source: authelia_session_secret
        uid: "0"
        gid: "0"
        mode: 0400
      - source: authelia_storage_encryption_key
        uid: "0"
        gid: "0"
        mode: 0400
      - source: authelia_storage_password
        uid: "0"
        gid: "0"
        mode: 0400
    environment:
      # The config templates reference this; without it the rendered cookie
      # domain is empty and Authelia refuses to start with "option 'domain'
      # is required" — which does not mention the missing variable at all.
      AISTACK_HOSTNAME: ${AISTACK_HOSTNAME:?hostname missing}
      X_AUTHELIA_CONFIG: /config/configuration.yml
      # REQUIRED for the `{{ env "..." }}` expressions in configuration.yml.
      # Authelia's config templating is OPT-IN; without this the braces are
      # passed through verbatim and the container crash-loops on
      # 'invalid character "{" in host name' — a failure that reads like a
      # malformed hostname rather than a disabled feature.
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/authelia_jwt_secret
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_encryption_key
      AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: /run/secrets/authelia_storage_password
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      # NOT `authelia health`: that subcommand DOES NOT EXIST in 4.39.28.
      # (The binary still writes /app/.healthcheck.env for it at startup,
      # which is why the read-only bind above is needed even though nothing
      # reads the file.)  The image is busybox-based, so wget is the probe.
      test: ["CMD-SHELL", "busybox wget -q -O /dev/null http://127.0.0.1:9091/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    <<: *hardened
    image: ${POSTGRES_IMAGE:?pin missing}:${POSTGRES_TAG:?pin missing}@${POSTGRES_DIGEST:?pin missing}
    container_name: aistack-postgres
    # E7 — MEASURED, not guessed (NOM-258 2026-10-18; RE-BISECTED on the
    # Debian 13 base, NOM-341 2026-10-20).
    #
    # The official entrypoint starts as root to chown PGDATA and then drops to
    # uid 999 via gosu.  Under `cap_drop: ALL` the chown fails with "Operation
    # not permitted" and the container crash-loops.  Each capability below was
    # established by bisection against the pinned digest:
    #
    #   CHOWN           chown PGDATA to postgres
    #   SETUID          \ gosu's drop from root to 999
    #   SETGID          /
    #   DAC_READ_SEARCH the entrypoint's `find` over an EXISTING PGDATA
    #
    # THREE THINGS HERE WERE ONLY RIGHT AFTER BEING MEASURED.
    #
    # (1) BOTH LIFECYCLE PATHS MUST BE TESTED.  The first bisection used a
    # fresh volume every time and concluded four capabilities were enough.
    # That set starts a NEW database and then fails on the FIRST RESTART with
    # "find: '/var/lib/postgresql/data/pgdata': Permission denied" — because
    # on an existing volume PGDATA is already 0700 owned by uid 999, and root
    # without a DAC bypass cannot traverse it.  A capability set validated
    # only against first boot is a container that works until it is restarted.
    #
    # (2) DAC_READ_SEARCH, NOT DAC_OVERRIDE.  Both complete the restart path.
    # DAC_OVERRIDE bypasses read, write AND execute checks on every file in
    # the container; DAC_READ_SEARCH bypasses only read and directory-search.
    # The entrypoint needs to traverse and read, not to write, so it gets the
    # one that cannot be used to overwrite a file it does not own.
    #
    # (3) FOWNER IS GONE, AND IT WAS MEASURED OUT, NOT TIDIED AWAY.  The pin
    # moved to the trixie (Debian 13) base, so the bisection was re-run against
    # the new digest — a capability set is evidence about ONE image.  Dropping
    # FOWNER from the five breaks nothing: first boot, two restarts and the
    # shipped healthcheck all pass without it, across three trials and again at
    # full fidelity with the real initdb.d scripts mounted.  Dropping any of
    # the remaining four does break something, so this set is minimal and not
    # just sufficient.  Re-measure this list whenever POSTGRES_DIGEST changes;
    # I9 now fails the build when E7's recorded digest and the pin disagree,
    # which is what forces that.
    cap_add: [CHOWN, SETUID, SETGID, DAC_READ_SEARCH]
    networks: [data]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # `CREATE EXTENSION vector` actually runs here; it is not assumed.
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
      # The health probe, as a FILE rather than a CMD-SHELL one-liner: it
      # asserts the end state of first-boot init and has to explain itself
      # when that assertion fails.  See the file's own header (NOM-307).
      - ./config/postgres/healthcheck.sh:/usr/local/bin/aistack-pg-health:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/postgresql:rw,nosuid,size=64m
    # uid/gid/mode BELOW ARE ADVISORY AND DOCKER COMPOSE IGNORES THEM.
    #
    # MEASURED, NOM-258 2026-10-18: `uid`, `gid` and `mode` on a FILE-based
    # secret are Swarm fields.  `docker compose config` echoes them back
    # faithfully, which makes them look honoured, and then Compose plain
    # bind-mounts the host file with its host ownership.  We watched Postgres
    # crash-loop on "Permission denied" with a config that rendered uid 999.
    #
    # So THE HOST FILE MODE IS THE ONLY CONTROL, exactly as S13 says, and
    # scripts/gen-secrets.sh owns it: 0640 root:<measured-gid> for a non-root
    # consumer, 0600 root:root for a root one. The values stay here because
    # they document the required in-container ownership and because they
    # become load-bearing the day this is run under Swarm — but nothing may
    # rely on them, and `aistack doctor` verifies readability by ASKING THE
    # RUNNING SERVICE rather than inferring it from either place.
    #
    # 999:999 is MEASURED: `getent passwd postgres` in the pinned image.
    # NOT the image's Config.User, which is empty because the entrypoint
    # starts as root and re-executes as postgres via gosu.
    secrets:
      - source: postgres_superuser_password
        uid: "999"
        gid: "999"
        mode: 0400
      - source: app_db_passwords
        uid: "999"
        gid: "999"
        mode: 0400
    environment:
      POSTGRES_USER: aistack_admin
      POSTGRES_DB: aistack
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      # Read by the init scripts to create ONE NON-SUPERUSER ROLE PER APP.
      # No app ever connects as a superuser.
      APP_DB_PASSWORDS_FILE: /run/secrets/app_db_passwords
      PGDATA: /var/lib/postgresql/data/pgdata
    mem_limit: 2g
    cpus: "2.0"
    # NOT `pg_isready` ALONE.  MEASURED (NOM-307, 2026-10-19): a first boot
    # whose init scripts die leaves a cluster that answers pg_isready, reports
    # health=healthy, and holds none of the four application roles — and the
    # entrypoint will never re-run init over that data directory.  A gate that
    # passes on a state only a volume wipe used to recover is worse than no
    # gate, because every service downstream of it then fails for a reason
    # that names a consequence instead of a cause.
    #
    # `restart: unless-stopped` is UNCHANGED and that is deliberate.  Switching
    # postgres to `on-failure:N` would stop Docker from starting it again after
    # a host reboot (the daemon restarts `always`/`unless-stopped` containers
    # on start, not `on-failure` ones) — trading a loud first boot for a stack
    # that does not come back from a power cut.  Invariant I10 also holds every
    # service to `unless-stopped`.  The honest fix is the gate, not the policy.
    #
    # start_period is 90s rather than 30s: the probe is now false until init
    # FINISHES, and during the start period a failing probe reads as
    # "starting" rather than "unhealthy", which is exactly the window init
    # needs.
    healthcheck:
      test: ["CMD", "/usr/local/bin/aistack-pg-health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 90s

  homepage:
    <<: *hardened
    image: ${HOMEPAGE_IMAGE:?pin missing}:${HOMEPAGE_TAG:?pin missing}@${HOMEPAGE_DIGEST:?pin missing}
    container_name: aistack-homepage
    networks: [apps]
    volumes:
      # Static, GENERATED from manifest.yaml.  Docker discovery is off and
      # there is no docker.sock anywhere in any profile (I6) — which is the
      # single change that removes the original stack's worst privilege.
      #
      # Mounted FILE BY FILE rather than as a directory.  Homepage writes its
      # logs into /app/config/logs, so a read-only bind over the whole
      # directory makes the container fail to start at all — and the obvious
      # repair, a tmpfs at /app/config/logs, cannot be created underneath a
      # read-only mount.  Per-file binds keep every config file read-only
      # while leaving the directory itself writable, which is the property we
      # actually wanted: the FILES are immutable, not the inode they sit in.
      - ./config/homepage/settings.yaml:/app/config/settings.yaml:ro
      - ./config/homepage/services.yaml:/app/config/services.yaml:ro
      - ./config/homepage/widgets.yaml:/app/config/widgets.yaml:ro
      - ./config/homepage/docker.yaml:/app/config/docker.yaml:ro
      - ./config/homepage/bookmarks.yaml:/app/config/bookmarks.yaml:ro
    tmpfs:
      - /app/config:rw,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${AISTACK_HOSTNAME:?hostname missing}
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  open-webui:
    <<: *hardened
    image: ${OPEN_WEBUI_IMAGE:?pin missing}:${OPEN_WEBUI_TAG:?pin missing}@${OPEN_WEBUI_DIGEST:?pin missing}
    container_name: aistack-open-webui
    # No `agents` bridge: G-AGENTS failed, so there is no gateway to call.
    networks: [apps, gateway, data, parse-owui]
    volumes:
      - openwebui-data:/app/backend/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    # E6: Open WebUI has no _FILE indirection, so its secrets are environment
    # variables — from a root-owned 0640 env_file, NEVER from .env and never
    # from the shell.  Bounded only because no container can reach the Docker
    # API; weakening that re-opens the exception.
    env_file:
      - ./secrets/open-webui.env
    environment:
      # The model front door is LiteLLM and only LiteLLM.
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      ENABLE_OLLAMA_API: "false"
      # I9: false in EVERY shipped profile.  The group that would have turned
      # this on (`web`) is deferred, so there is no profile where true is
      # correct.
      ENABLE_WEB_SEARCH: "false"
      ENABLE_RAG_WEB_SEARCH: "false"
      # RAG goes through Docling into pgvector over the one `parse` bridge.
      VECTOR_DB: pgvector
      CONTENT_EXTRACTION_ENGINE: docling
      DOCLING_SERVER_URL: http://docling-serve:5001
      DATABASE_URL: postgresql://openwebui:${OPENWEBUI_DB_PASSWORD:?missing}@postgres:5432/openwebui
      PGVECTOR_DB_URL: postgresql://openwebui:${OPENWEBUI_DB_PASSWORD:?missing}@postgres:5432/openwebui
      # Authelia fronts this; Open WebUI's own signup surface stays shut.
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "false"
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: Remote-Email
      WEBUI_AUTH_TRUSTED_NAME_HEADER: Remote-Name
      WEBUI_URL: https://${AISTACK_HOSTNAME:?hostname missing}
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    mem_limit: 4g
    cpus: "2.0"
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  ollama:
    <<: *hardened
    image: ${OLLAMA_IMAGE:?pin missing}:${OLLAMA_TAG:?pin missing}@${OLLAMA_DIGEST:?pin missing}
    container_name: aistack-ollama
    # `inference` is internal: Ollama has NO path to the registry from here.
    # Model weights arrive through the short-lived model-puller helper on
    # `egress`, writing the same named volume (final-design §5.4).
    # Pulling a model from the Open WebUI UI does not work, and the docs say so.
    networks: [inference]
    volumes:
      - ollama-models:/root/.ollama
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    environment:
      # Default is 3; one is correct on a CPU-only box.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_HOST: "0.0.0.0:11434"
      # Hermes needs 64k and talks to Ollama over the OpenAI-style /v1 API,
      # which IGNORES num_ctx: without this Ollama silently serves 4096 while
      # Hermes believes it has 65536 (NOM-412 §5).  This costs RAM for every
      # model — Tier 1 may lower it, and then Hermes should not be enabled.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-65536}
    mem_limit: 8g
    cpus: "4.0"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  litellm:
    <<: *hardened
    image: ${LITELLM_IMAGE:?pin missing}:${LITELLM_TAG:?pin missing}@${LITELLM_DIGEST:?pin missing}
    container_name: aistack-litellm
    # NO `egress`.  Adding a cloud provider adds that bridge and MAKES TIER B
    # MANDATORY — the installer preflight enforces it, this file does not
    # quietly allow it.
    networks:
      gateway: {}
      inference: {}
      data: {}
      mcp-web: {}
      tracing: {}
      llm:
        ipv4_address: 172.31.254.2
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # E6: no _FILE indirection upstream.
    env_file:
      - ./secrets/litellm.env
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?missing}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      # MEASURED: the pinned LiteLLM image has NO curl and no wget, so the
      # obvious probe reports "unhealthy" forever while the service is fine.
      # Python is guaranteed present — it is what the application runs on.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  n8n:
    <<: *hardened
    image: ${N8N_IMAGE:?pin missing}:${N8N_TAG:?pin missing}@${N8N_DIGEST:?pin missing}
    container_name: aistack-n8n
    # NO `egress` in the MVP, and no `agents` bridge (G-AGENTS failed).
    networks: [apps, gateway, data]
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/opt/aistack/workflows:ro
      - ./samples:/opt/aistack/samples:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      # MEASURED: n8n compiles static assets into ~/.cache during startup.
      # Under `read_only: true` that mkdir fails with ENOENT and the process
      # exits — the named volume at /home/node/.n8n does not make its SIBLING
      # writable, which is easy to assume and wrong.
      - /home/node/.cache:rw,nosuid,size=256m,uid=1000,gid=1000
    # 1000:1000 is MEASURED: the `node` user in the pinned n8n image.
    secrets:
      - source: n8n_encryption_key
        uid: "1000"
        gid: "1000"
        mode: 0400
    environment:
      # REGULAR MODE ONLY (C3).  No queue mode, no worker.
      EXECUTIONS_MODE: regular
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?missing}
      N8N_HOST: ${AISTACK_HOSTNAME:?hostname missing}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${AISTACK_HOSTNAME:?hostname missing}/n8n/
      N8N_PROXY_HOPS: "1"
      # v2: n8n's built-in MCP server is ON so Hermes can trigger workflows.  It
      # is reachable from `gateway` only, and LiteLLM's one allowlist
      # (search_workflows / get_workflow_details / execute_workflow) is the only
      # caller we configure.  Mutating workflows still run behind the approval
      # envelope, which is a property of the WORKFLOW, not of the transport.
      N8N_MCP_SERVER_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_SECURE_COOKIE: "true"
      # limits.yaml v1: agent wall clock per run.
      EXECUTIONS_TIMEOUT: "300"
      EXECUTIONS_TIMEOUT_MAX: "900"
      GENERIC_TIMEZONE: ${AISTACK_TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================================================
  # knowledge
  # ===========================================================================

  docling-serve:
    <<: *hardened
    image: ${DOCLING_IMAGE:?pin missing}:${DOCLING_TAG:?pin missing}@${DOCLING_DIGEST:?pin missing}
    container_name: aistack-docling
    profiles: [knowledge]
    # One pairwise /29 with Open WebUI.  `parse-agw` — its second bridge in the
    # design — is deferred with the `agents` group, so in this build Docling has
    # exactly one peer.
    #
    # What that buys, stated at its own size: Docling has NO NAT'd path to the
    # internet at either tier, and can reach no container other than Open WebUI.
    # It CAN attempt a connection back to Open WebUI's authenticated port — they
    # share the /29 — and at Tier A it can attempt a connection to a host
    # listener bound on a wildcard address.  The design makes no claim either
    # way about LAN addresses.  A disabled URL-fetch setting constrains a
    # HEALTHY parser; it is not containment of a compromised one.
    networks: [parse-owui]
    volumes:
      - docling-models:/opt/app-root/src/.cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      # It receives bytes only.
      DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS: "false"
      DOCLING_SERVE_MAX_SYNC_WAIT: "120"
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "5001"
    mem_limit: 4g
    cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================================================
  # v2 core (NOM-413) — the personal agent, its memory, the one MCP backend for
  # the web, and the search/crawl pair.  No profile key: they run on every
  # install.  Hermes' bot token is the ONLY thing that can be a placeholder.
  # ===========================================================================

  hermes:
    <<: *hardened
    image: ${HERMES_IMAGE:?pin missing}:${HERMES_TAG:?pin missing}@${HERMES_DIGEST:?pin missing}
    container_name: aistack-hermes
    # gVisor runs EVERYTHING the agent executes (its terminal tool, code
    # execution, any skill script) in a user-space kernel (DoD section 1, "Agent
    # sandbox").  `scripts/install-gvisor.sh` registers the runtime; `aistack
    # doctor` fails if it is missing, because falling back to runc here would
    # quietly drop the one control this container's compromise story rests on.
    runtime: runsc
    # E11 — measured by bisection (NOM-413, runsc, this digest).  The image's
    # PID 1 is s6-overlay as ROOT: stage2 chowns /opt/data and then every
    # service drops to uid 10000 with s6-setuidgid.  Dropping CHOWN, SETUID or
    # SETGID stops it; dropping DAC_OVERRIDE gives 101 "permission denied"
    # lines and no gateway; FOWNER is not needed and is not granted.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    networks:
      agent:
        ipv4_address: 172.31.252.3
      llm:
        ipv4_address: 172.31.254.3
      tg-relay:
        ipv4_address: 172.31.253.3
    # Telegram is reached ONLY through the gate (172.31.253.2).  The name is
    # pinned here so Hermes needs no proxy setting and its TLS verification
    # still ends at Telegram's real certificate.
    # gVisor has its own network stack and cannot use Docker's embedded DNS
    # (127.0.0.11 refuses connections: measured, NOM-413), so every peer Hermes
    # calls is pinned to a fixed address on a two-member bridge.
    extra_hosts:
      - "api.telegram.org:172.31.253.2"
      - "litellm:172.31.254.2"
      - "mem0:172.31.252.2"
    volumes:
      - hermes-data:/opt/data
      # Behavioural config; the bot token and keys come from the secrets file
      # below, never from here.
      - ./config/hermes/config.yaml:/opt/data/config.yaml:ro
      - ./config/hermes/mem0.json:/opt/data/mem0.json:ro
      - ./secrets/hermes.env:/opt/data/.env:ro
      # The Mem0 memory plugin, vendored unmodified at a pinned commit
      # (third_party/hermes-plugin-mem0/SOURCE).  Hermes cannot fetch plugins
      # from GitHub: it has no route to it.
      - ./third_party/hermes-plugin-mem0:/opt/data/plugins/mem0:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      # s6-overlay execs its own helpers from /run.
      - /run:rw,exec,nosuid,size=64m
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      MEM0_TELEMETRY: "False"
      # Hermes checks for updates and phones the Nous Portal by default.
      HERMES_DISABLE_UPDATE_CHECK: "1"
      HERMES_TELEGRAM_DISABLE_FALLBACK_IPS: "true"
    depends_on:
      litellm:
        condition: service_healthy
      mem0:
        condition: service_healthy
      telegram-gate:
        condition: service_healthy
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    command: ["gateway", "run"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'hermes.*gateway' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  mem0:
    <<: *hardened
    build:
      context: ./build/mem0
      args:
        BASE: ${PYBASE_IMAGE:?pin missing}:${PYBASE_TAG:?pin missing}@${PYBASE_DIGEST:?pin missing}
    image: aistack-local/mem0:${AISTACK_BUILD_TAG:-v2}
    pull_policy: never
    container_name: aistack-mem0
    networks:
      agent:
        ipv4_address: 172.31.252.2
      gateway: {}
      data: {}
    volumes:
      - mem0-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    secrets:
      - source: mem0_api_key
      - source: mem0_litellm_key
      - source: mem0_db_password
    environment:
      AISTACK_MEM0_KEY_FILE: /run/secrets/mem0_api_key
      AISTACK_MEM0_LITELLM_KEY_FILE: /run/secrets/mem0_litellm_key
      AISTACK_MEM0_DB_PASSWORD_FILE: /run/secrets/mem0_db_password
      AISTACK_LITELLM_URL: http://litellm:4000/v1
      AISTACK_EMBED_DIMS: "1024"
      MEM0_TELEMETRY: "False"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    mem_limit: 768m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mcp-web:
    <<: *hardened
    build:
      context: ./build/mcp-web
      args:
        BASE: ${PYBASE_IMAGE:?pin missing}:${PYBASE_TAG:?pin missing}@${PYBASE_DIGEST:?pin missing}
    image: aistack-local/mcp-web:${AISTACK_BUILD_TAG:-v2}
    pull_policy: never
    container_name: aistack-mcp-web
    # E3 — it sits on two NAT'd bridges because it is the only caller of both
    # fetchers.  See manifest.yaml trust_bridges for the controls.
    networks: [mcp-web, untrusted-search, untrusted-crawl]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    secrets:
      - source: mcp_crawl4ai_token
    environment:
      CRAWL4AI_TOKEN_FILE: /run/secrets/mcp_crawl4ai_token
      SEARXNG_URL: http://searxng:8080
      CRAWL4AI_URL: http://crawl4ai:11235
      MCP_ALLOWED_HOSTS: "mcp-web:8900,mcp-web"
    depends_on:
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.create_connection(('127.0.0.1',8900),3); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  searxng:
    <<: *hardened
    image: ${SEARXNG_IMAGE:?pin missing}:${SEARXNG_TAG:?pin missing}@${SEARXNG_DIGEST:?pin missing}
    container_name: aistack-searxng
    user: "977:977"
    # E3 — nat_egress pairwise /29 with mcp-web.  It must reach search engines.
    networks: [untrusted-search]
    volumes:
      - ./secrets/searxng-settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/searxng:rw,noexec,nosuid,size=64m,uid=977,gid=977
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  crawl4ai:
    <<: *hardened
    image: ${CRAWL4AI_IMAGE:?pin missing}:${CRAWL4AI_TAG:?pin missing}@${CRAWL4AI_DIGEST:?pin missing}
    container_name: aistack-crawl4ai
    # Chromium renders hostile pages.  gVisor is the containment here, because
    # Chromium's own sandbox needs user namespaces that `cap_drop: ALL` removes,
    # and this repository does not pass the flag that disables it (I6).
    runtime: runsc
    networks: [untrusted-crawl]
    shm_size: 1g
    # Crawl4AI 0.9.5 serves only on loopback unless it has an API token; the
    # token is a mounted secret (its entrypoint reads /run/secrets/api_token),
    # so it never enters the environment, and mcp-web holds the same value.
    secrets:
      - source: crawl4ai_api_token
        target: api_token
    tmpfs:
      - /tmp:rw,nosuid,size=512m
      - /home/appuser/.crawl4ai:rw,noexec,nosuid,size=128m,uid=999,gid=999
      - /var/lib/redis:rw,noexec,nosuid,size=64m,uid=999,gid=999
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 1024
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11235/health || exit 1"]  # /health is unauthenticated
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  telegram-gate:
    <<: *hardened
    image: ${NGINX_IMAGE:?pin missing}:${NGINX_TAG:?pin missing}@${NGINX_DIGEST:?pin missing}
    container_name: aistack-telegram-gate
    networks:
      tg-relay:
        ipv4_address: 172.31.253.2
      egress-tg: {}
    # Non-root from the start: no CHOWN/SETUID is needed, and the privileged
    # port is opened by a namespaced sysctl rather than by a capability.
    user: "101:101"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/aistack-gate.conf"]
    volumes:
      - ./config/telegram-gate/nginx.conf:/etc/nginx/aistack-gate.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
      - /var/cache/nginx:rw,noexec,nosuid,size=8m
    mem_limit: 64m
    cpus: "0.25"
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # tracing — profile `tracing`, OFF BY DEFAULT.  NOM-412 measured Langfuse at
  # 2.59 GB idle and 3.15 GB p95 under load; that does not fit Tier 1 next to
  # the rest, so enabling it is a choice (founder risk R2), not a default.
  # Valkey is here and nowhere else: it is the only service that needs a
  # Redis-protocol store.
  # ===========================================================================

  langfuse-web:
    <<: *hardened
    image: ${LANGFUSE_WEB_IMAGE:?pin missing}:${LANGFUSE_WEB_TAG:?pin missing}@${LANGFUSE_WEB_DIGEST:?pin missing}
    container_name: aistack-langfuse-web
    profiles: [tracing]
    networks: [tracing, data]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/.next/cache:rw,noexec,nosuid,size=128m
    # E12: no _FILE indirection upstream; a host-side env_file, like E6.
    env_file:
      - ./secrets/langfuse.env
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?missing}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      HOSTNAME: "0.0.0.0"
      TELEMETRY_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_USE_AZURE_BLOB: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_TLS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  langfuse-worker:
    <<: *hardened
    image: ${LANGFUSE_WORKER_IMAGE:?pin missing}:${LANGFUSE_WORKER_TAG:?pin missing}@${LANGFUSE_WORKER_DIGEST:?pin missing}
    container_name: aistack-langfuse-worker
    profiles: [tracing]
    networks: [tracing, data]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    env_file:
      - ./secrets/langfuse.env
    environment: *langfuse-env
    depends_on:
      langfuse-web:
        condition: service_healthy
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3030/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  clickhouse:
    <<: *hardened
    image: ${CLICKHOUSE_IMAGE:?pin missing}:${CLICKHOUSE_TAG:?pin missing}@${CLICKHOUSE_DIGEST:?pin missing}
    container_name: aistack-clickhouse
    user: "101:101"
    profiles: [tracing]
    networks: [tracing]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /var/log/clickhouse-server:rw,noexec,nosuid,size=128m,uid=101,gid=101
      # The entrypoint writes the langfuse user here when CLICKHOUSE_USER is set.
      - /etc/clickhouse-server/users.d:rw,noexec,nosuid,size=1m,uid=101,gid=101
    env_file:
      - ./secrets/clickhouse.env
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_DB: default
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 1024
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    <<: *hardened
    image: ${MINIO_IMAGE:?pin missing}:${MINIO_TAG:?pin missing}@${MINIO_DIGEST:?pin missing}
    container_name: aistack-minio
    profiles: [tracing]
    networks: [tracing]
    volumes:
      - minio-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - ./secrets/minio.env
    # The image's wrapper treats argv[1] as the data dir, so its default CMD
    # ("minio server /data") fails its own check ("Data directory minio does not
    # exist"); minio is started directly.  It still refuses to start without credentials.
    entrypoint: ["minio"]
    command: ["server", "/data", "--address", ":9000", "--console-address", "127.0.0.1:9001"]
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  valkey:
    <<: *hardened
    image: ${VALKEY_IMAGE:?pin missing}:${VALKEY_TAG:?pin missing}@${VALKEY_DIGEST:?pin missing}
    container_name: aistack-valkey
    user: "999:999"
    profiles: [tracing]
    networks: [tracing]
    tmpfs:
      - /data:rw,noexec,nosuid,size=16m,uid=999,gid=999
    secrets:
      - source: valkey_password
    # Persistence is off: it holds queues and caches, and a restart losing them
    # is fine.  The password is read from a file so it never appears in argv.
    command:
      - sh
      - -c
      - exec valkey-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy noeviction --requirepass "$$(cat /run/secrets/valkey_password)"
    mem_limit: 192m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/valkey_password)\" valkey-cli ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# ---------------------------------------------------------------------------
# Bridges.  `internal:` is mandated by each bridge's own `zone_policy` in
# manifest.yaml, NOT by its class — ui-comfy and ui-vpn are both class `ui` and
# need opposite flags, so a boolean per class could not work.  I11 asserts every
# flag here equals what its zone_policy mandates.
#
# TWO bridges in this build are non-internal: `edge` (published) and `egress`
# (nat_egress).  Neither carries a service with untrusted_input: yes — that is
# invariant I7, and it is the whole of the MVP's egress story.
# ---------------------------------------------------------------------------
networks:
  edge:
    name: aistack-edge
    # zone_policy: published — carries caddy's published ports.
    internal: false
  apps:
    name: aistack-apps
    internal: true          # zone_policy: contained
    enable_ipv6: false
  gateway:
    name: aistack-gateway
    internal: true          # zone_policy: contained
    enable_ipv6: false
  inference:
    name: aistack-inference
    internal: true          # zone_policy: contained
    enable_ipv6: false
  data:
    name: aistack-data
    internal: true          # zone_policy: contained
    enable_ipv6: false
  parse-owui:
    name: aistack-parse-owui
    internal: true          # zone_policy: contained
    enable_ipv6: false
    # Fixed /29 so a Tier-B rule can match it (I8).  Two addressable hosts.
    ipam:
      config:
        - subnet: 172.31.244.0/29
  # ---- v2 (NOM-413) ----
  agent:
    name: aistack-agent
    internal: true          # zone_policy: contained
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.252.0/29
  llm:
    name: aistack-llm
    internal: true          # zone_policy: contained
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.254.0/29
  mcp-web:
    name: aistack-mcp-web
    internal: true          # zone_policy: contained
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.249.0/29
  tg-relay:
    name: aistack-tg-relay
    internal: true          # zone_policy: contained
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.253.0/29
  # The two bridges below are the ONLY non-internal ones the v2 core adds, and
  # each has exactly the members its manifest entry names.  See E3 and the
  # trust_bridges register.
  egress-tg:
    name: aistack-egress-tg
    internal: false         # zone_policy: nat_egress — telegram-gate only
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.251.0/29
  untrusted-search:
    name: aistack-untrusted-search
    internal: false         # zone_policy: nat_egress — mcp-web + searxng
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.240.0/29
  untrusted-crawl:
    name: aistack-untrusted-crawl
    internal: false         # zone_policy: nat_egress — mcp-web + crawl4ai
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.241.0/29
  tracing:
    name: aistack-tracing
    internal: true          # zone_policy: contained
    enable_ipv6: false

  # `egress` IS DELIBERATELY NOT DECLARED HERE.
  #
  # zone_policy: nat_egress.  Its only member is the short-lived model-puller.
  # Compose prunes a network no service references, so declaring it here and
  # attaching nothing to it gives a bridge whose existence depends on compose's
  # pruning behaviour rather than on the design.  `aistack models pull` creates
  # 172.31.246.0/29 for the life of the helper and removes it afterwards.
  #
  # The consequence is worth stating because it is better than the design
  # assumed: THE ONE NAT-CAPABLE BRIDGE IN THE STACK DOES NOT EXIST WHILE THE
  # STACK IS MERELY RUNNING.  At steady state `edge` is the only non-internal
  # bridge.  That is still not a containment claim — see the header.

volumes:
  postgres-data:   { name: aistack-postgres-data }
  n8n-data:        { name: aistack-n8n-data }
  openwebui-data:  { name: aistack-openwebui-data }
  caddy-data:      { name: aistack-caddy-data }
  caddy-config:    { name: aistack-caddy-config }
  authelia-data:   { name: aistack-authelia-data }
  ollama-models:   { name: aistack-ollama-models }
  docling-models:  { name: aistack-docling-models }
  hermes-data:     { name: aistack-hermes-data }
  mem0-data:       { name: aistack-mem0-data }
  clickhouse-data: { name: aistack-clickhouse-data }
  minio-data:      { name: aistack-minio-data }

# ---------------------------------------------------------------------------
# File-based secrets at /run/secrets/<name>, for everything that supports a
# _FILE indirection.  Postgres, n8n and Authelia all do.  Open WebUI and LiteLLM
# do not — that is exception E6, and they use a root-owned 0640 env_file.
#
# File MODE is per service, not a blanket 0600 (S13): the installer writes
# 0640 root:<service-gid> where the consumer is non-root and 0600 root:root
# where it runs as root.  A blanket 0600 and "each service can read its own
# secret" cannot both be true for a non-root container.
# ---------------------------------------------------------------------------
secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  app_db_passwords:
